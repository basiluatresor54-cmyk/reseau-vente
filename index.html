<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stock">
<title>BASILUA TECH · Réseau & Vente</title>
<style>
:root{
  --brand:#0F766E;--brand-ink:#fff;--brand-soft:rgba(15,118,110,.12);
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--muted:#6b7280;--line:#e7e9ee;
  --ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fdf2e1;
  --bad:#b91c1c;--bad-soft:#fdeaea;--info:#1d4ed8;--info-soft:#e8eefc;--vio:#6d28d9;--vio-soft:#f1eafd;
  --r:16px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --field:#fff;--soft:#eef0f3;--soft2:#f0f1f4;--hover:#f7f8fa;--sum:#fafbfc;--msg:#eafbe7;--okbox:#ecfdf5;--okline:#a7f3d0;--money-soft:#e9f7f4;--money:#0f766e;--x:#e7e9ee;--brand-tx:var(--brand);--navbg:rgba(255,255,255,.97);
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0f1115;--card:#1a1d23;--ink:#e8eaed;--muted:#9aa1ac;--line:#2c313a;
  --ok:#4ade80;--ok-soft:rgba(74,222,128,.14);--warn:#fbbf24;--warn-soft:rgba(251,191,36,.14);
  --bad:#f87171;--bad-soft:rgba(248,113,113,.14);--info:#7aa2ff;--info-soft:rgba(122,162,255,.15);--vio:#b79bff;--vio-soft:rgba(183,155,255,.15);
  --shadow:0 0 0 1px rgba(255,255,255,.04);
  --field:#14171c;--soft:#262a31;--soft2:#22262d;--hover:#22262d;--sum:#16191e;--msg:#16291c;--okbox:rgba(74,222,128,.10);--okline:rgba(74,222,128,.35);--money-soft:rgba(45,212,191,.14);--money:#5eead4;--x:#2a2e35;--navbg:rgba(26,29,35,.97);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:calc(12px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover;background:#fff}
.top h1{font-size:17px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top p{font-size:12.5px;opacity:.85}
.top .grow{min-width:0;flex:1}

main{max-width:980px;margin:0 auto;padding:16px}
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h2{font-size:15px;font-weight:700}
.link{font-size:13px;color:var(--brand-tx);font-weight:650;text-decoration:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--brand-tx);margin-bottom:12px;font-size:14px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;min-width:0;text-align:left}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:750;margin-top:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--brand);color:var(--brand-ink)}
.kpi.hero .l,.kpi.hero .s{color:inherit;opacity:.88}
.kpi.hero .v{font-size:28px}
.v.pos{color:var(--ok)}.v.neg{color:var(--bad)}
.kpi.hero .v.neg{color:#fecaca}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--brand);color:var(--brand-ink)}
.chip b{font-weight:700;margin-left:4px;opacity:.8}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.it:last-child{border-bottom:0}
button.it:active{background:var(--hover)}
.it .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px}
.it .m{flex:1;min-width:0}
.it .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .r{text-align:right;flex:none}
.it .big{font-size:20px;font-weight:750;line-height:1.1}
.it .sm{font-size:11.5px;color:var(--muted)}
.c-in{background:var(--ok-soft);color:var(--ok)}
.c-out{background:var(--info-soft);color:var(--info)}
.c-loss{background:var(--warn-soft);color:var(--warn)}
.c-send{background:var(--vio-soft);color:var(--vio)}
.c-money{background:var(--money-soft);color:var(--money)}
.c-x{background:var(--soft2);color:var(--muted)}
.c-brand{background:var(--brand-soft);color:var(--brand-tx)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-attente{background:var(--warn-soft);color:var(--warn)}
.p-encours{background:var(--info-soft);color:var(--info)}
.p-livre{background:var(--ok-soft);color:var(--ok)}
.p-annule{background:var(--soft2);color:var(--muted)}
.qty-low{color:var(--warn)}.qty-zero{color:var(--bad)}
.strike{text-decoration:line-through;opacity:.6}
.red{color:var(--bad)}.green{color:var(--ok)}

.bars{display:flex;align-items:flex-end;gap:4px;height:110px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--brand);min-height:2px}
.bars i.z{background:var(--line)}
.bars span{font-size:10px;color:var(--muted)}
.hb{display:flex;align-items:center;gap:10px;padding:8px 0}
.hb .n{width:40%;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{flex:1;height:10px;background:var(--brand-soft);border-radius:6px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--brand);border-radius:6px}
.hb .q{font-size:12.5px;color:var(--muted);width:78px;text-align:right}
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);margin:4px 0 12px}
.split i{display:block;height:100%}
.leg{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg:last-child{border-bottom:0}
.leg .dot{width:10px;height:10px;border-radius:3px;flex:none}
.leg .n{flex:1;color:var(--muted)}
.leg .a{font-weight:650}
.leg .p{width:46px;text-align:right;font-size:12px;color:var(--muted)}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tb td{padding:9px 4px;border-bottom:1px solid var(--line)}
.tb tr:last-child td{border-bottom:0}
.tb .rt{text-align:right}
.tbw{overflow-x:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:650;background:var(--soft);color:var(--ink);min-height:46px;text-decoration:none;font-size:14.5px;text-align:center}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.wa{background:#1fa855;color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost-bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack>*+*{margin-top:10px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
.f small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.f input,.f select,.f textarea,.search{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);min-height:46px;font-size:16px;outline:none}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus,.search:focus{border-color:var(--brand)}
.f input[type=color]{padding:4px;height:46px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.search{margin-bottom:12px;background:var(--card)}
.tot{background:var(--brand-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:flex;justify-content:space-between;gap:4px 8px;flex-wrap:wrap}
.tot b{font-size:17px}
.tot small{width:100%;font-size:12.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.acts{display:grid;gap:8px;margin-top:6px}
.actc{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.actc:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.actc input{width:20px!important;height:20px;margin:2px 0 0;flex:none;accent-color:var(--brand)}
.actc .ai{font-size:22px;line-height:1}.actc b{display:block;font-size:14.5px}.actc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.instcard{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;border:1.5px solid var(--brand)}
.instic{font-size:30px;line-height:1}
.isteps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.isteps li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.istep{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.ikey{display:inline-block;background:var(--soft);border-radius:6px;padding:0 5px}
.ilink{display:flex;gap:8px;margin-top:8px}.ilink input{flex:1;min-width:0;font-size:13px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:block;text-align:left;width:100%}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 4px;border-radius:10px;background:var(--soft2);font-size:12.5px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg2{grid-template-columns:1fr 1fr}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.colors button{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.colors button.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kv div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.kv b{display:block;font-size:19px}
.kv span{font-size:11.5px;color:var(--muted)}
.dl{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.dl:last-child{border-bottom:0}
.dl>span:first-child{color:var(--muted)}
.dl>span:last-child{text-align:right;font-weight:650}
.dl.strong>span{color:var(--ink)!important;font-weight:750}
.kitrow{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-bottom:8px}
.kitrow select,.kitrow input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);min-height:44px;font-size:15px}
.city{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.menu .it .ic{width:42px;height:42px}

nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav.nav button.on{color:var(--brand-tx)}
nav.nav button.on svg{stroke-width:2.3}
.fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.fab svg{width:28px;height:28px}

.ov{position:fixed;inset:0;z-index:50;background:rgba(15,18,25,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.ov.on{opacity:1}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .2s}
.ov.on .sh{transform:none}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 8px}
.sh-h h3{font-size:18px;line-height:1.25}
.x{width:36px;height:36px;border-radius:50%;background:var(--x);font-size:22px;line-height:1;color:var(--muted);flex:none}
.sh-b{overflow-y:auto;padding:6px 18px calc(22px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(15,18,25,.5);display:grid;place-items:center;padding:24px}
.dlg .card{max-width:380px;width:100%;padding:20px}
.dlg p{margin-bottom:16px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#16181d;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;z-index:70;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.act{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);text-align:left;margin-bottom:8px}
.act .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.act b{display:block}
.act small{color:var(--muted);font-size:12.5px}
.paste summary{cursor:pointer;list-style:none;margin-bottom:8px}
.paste summary::-webkit-details-marker{display:none}
.paste textarea{width:100%;min-height:110px;padding:10px 12px;border:1.5px dashed var(--brand);border-radius:11px;background:var(--field);font-size:15px;margin-bottom:8px}
pre.msg{white-space:pre-wrap;font:13px/1.45 -apple-system,Roboto,sans-serif;background:var(--msg);border-radius:10px;padding:10px;margin-top:4px}
details summary{cursor:pointer}

/* ----- version en ligne ----- */
body.authon .top, body.authon nav.nav, body.authon .fab, body.authon main{display:none!important}
#auth{position:fixed;inset:0;z-index:45;overflow-y:auto;background:linear-gradient(180deg,var(--brand) 0,var(--brand) 190px,var(--bg) 190px);padding:calc(28px + env(safe-area-inset-top)) 16px 40px}
.auth-box{max-width:420px;margin:0 auto;background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:24px 20px;text-align:center}
.auth-box h1{font-size:21px;margin:8px 0 2px}
.auth-box form{text-align:left}
.auth-logo{width:58px;height:58px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto}
.auth-logo svg{width:32px;height:32px}
.auth-msg{color:var(--bad);font-size:13.5px;font-weight:600;min-height:4px;margin:2px 0 10px;text-align:left}
.subban{border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}
.subban.info{background:var(--info-soft);color:var(--info)}
.subban.warn{background:var(--warn-soft);color:var(--warn)}
.subban.bad{background:var(--bad-soft);color:var(--bad)}
.subban.subsmall{padding:7px 12px;font-size:12.5px;margin-bottom:10px}.subban a.link{color:inherit;text-decoration:underline}
.syncpill{flex:none;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);color:inherit;white-space:nowrap}
.syncpill.s-off,.syncpill.s-wait{background:#fff3;box-shadow:inset 0 0 0 1.5px #fde68a}
.syncpill.s-err{background:#fecaca;color:#7f1d1d}
.ntbell{flex:none;position:relative;width:38px;height:34px;border-radius:999px;border:0;background:rgba(255,255,255,.18);color:inherit;font-size:17px;margin-right:6px;cursor:pointer}
.ntbell b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#ef4444;color:#fff;font-size:11px;line-height:18px;font-weight:800}
.ntrow.unread{background:color-mix(in srgb,var(--brand) 9%,transparent)}
body.livmode nav.nav{display:none!important}
body.livmode{padding-bottom:24px}
@media (min-width:900px){body.livmode{padding-left:0}}
textarea.code{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace;padding:10px;border:1.5px solid var(--line);border-radius:11px}

.tb .num{white-space:nowrap}
.phtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.phtools .btn{min-height:34px;padding:6px 10px;font-size:13px}
/* photos produits */
.ic.pic{padding:0;overflow:hidden;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:22px}.ic.pic img{width:100%;height:100%;object-fit:cover}
/* vente rapide / rapport du jour */
.quickbtn{font-size:18px;padding:16px;margin:4px 0 10px}
.daycard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:10px;gap:8px}
.qty{display:flex;gap:6px;align-items:center}.qty input{text-align:center;min-width:0}
.okbox{background:var(--okbox);border:1px solid var(--okline)}
/* relevé */
.relh .logo{background:var(--brand);color:var(--brand-ink);width:48px;height:48px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.sign div{border-top:1px solid #999;padding-top:6px;font-size:12px;color:var(--muted,#666);text-align:center;margin-top:34px}

/* ===== Design « Verre » (style iPhone) — activé par html.glass ===== */
html.glass{--gl:rgba(255,255,255,.66);--gl2:rgba(255,255,255,.78);--glb:rgba(255,255,255,.7);--gls:0 8px 28px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04)}
html.glass[data-theme=dark]{--gl:rgba(32,35,43,.62);--gl2:rgba(36,40,48,.82);--glb:rgba(255,255,255,.08);--gls:0 10px 30px rgba(0,0,0,.35)}
html.glass body{background:
  radial-gradient(900px 520px at -10% -8%, rgba(var(--brand-rgb),.22), transparent 60%),
  radial-gradient(700px 480px at 110% 18%, rgba(var(--brand-rgb),.12), transparent 60%),

/* ---------- Calculs : stock ---------- */
// Un pack (kit) se décompose en ses produits ; le stock est tenu sur les produits simples.
function lines(pid, qty){ const p = prod(pid); return isKit(p) ? p.kit.map(c => [c.pid, c.q*qty]) : [[pid, qty]]; }
// Le stock ne sort qu'au moment où la vente est « Livrée » : une commande en attente ne bloque rien
const isOutSale = m => m.type === 'vente' && m.status === 'livre';
function stockAt(moves = S.moves){
  const st = {};
  const add = (loc, pid, q) => { const L = st[loc] = st[loc] || {}; L[pid] = (L[pid]||0) + q; };
  for(const m of moves){
    if(!m.pid) continue;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'entree') add('', pid, q);
      else if(m.type === 'envoi'){ add('', pid, -q); add(m.liv, pid, q); }
      else if(m.type === 'retour'){ add(m.liv, pid, -q); add('', pid, q); }
      else if(isOutSale(m)) add(m.liv||'', pid, -q);
      else if(m.type === 'perte') add(m.loc||'', pid, -q);
      else if(m.type === 'ajust') add(m.loc||'', pid, q);
    }
  }
  return st;
}
const qAt = (st, loc, pid) => (st[loc] && st[loc][pid]) || 0;
function avail(st, loc, pid){ // quantité disponible (packs : nombre de packs possibles)
  const p = prod(pid);
  if(isKit(p)) return Math.max(0, Math.min(...p.kit.map(c => Math.floor(qAt(st, loc, c.pid) / c.q))));
  return qAt(st, loc, pid);
}
function totalOf(st, pid){ let t = 0; for(const loc in st) t += st[loc][pid]||0; return t; }
function inHands(st, pid){ let t = 0; for(const loc in st) if(loc) t += st[loc][pid]||0; return t; }
// Vérifie qu'aucun stock ne devient négatif après une modification
function checkStock(newMoves, pids){
  const st = stockAt(newMoves);
  const set = new Set(); pids.forEach(id => lines(id, 1).forEach(([p]) => set.add(p)));
  for(const loc in st) for(const pid of set) if((st[loc][pid]||0) < 0)
    return `Stock insuffisant : ${pname(pid)} ${locName(loc)} (il manque ${-st[loc][pid]})`;
  return '';
}

/* ---------- Calculs : argent ---------- */
const saleUSD = m => toUSD(m.qty * m.price, m.cur, m.rate);
const moneyUSD = m => toUSD(m.amount, m.cur, m.rate);
function unitCostUSD(p){
  if(!p) return 0;
  if(num(p.buy) > 0) return toUSD(num(p.buy), p.cur);
  if(isKit(p)) return p.kit.reduce((s,c) => s + unitCostUSD(prod(c.pid)) * c.q, 0);
  return 0;
}
// Commission d'un livreur pour 1 pièce : selon le produit (montant fixe ou %), ou % propre au livreur, ou 0 si salarié
function commUFor(p, l, unitUSD){
  if(!p || !l || l.pay === 'salaire') return 0;
  if(l.pay === 'pct') return unitUSD * num(l.pct) / 100;
  const c = commFor(p, l.city);
  return p.commMode === 'pct' ? unitUSD * c / 100 : c;
}
// Commission du produit pour une ville (valeur propre à la ville si renseignée, sinon valeur générale)
function commFor(p, city){
  const cc = p && p.commCity;
  if(city && cc){ const k = Object.keys(cc).find(x => norm0(x) === norm0(city)); if(k && cc[k] !== '' && cc[k] != null) return num(cc[k]); }
  return num(p && p.comm);
}
const norm0 = t => String(t||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const commVal = (p, v) => p.commMode === 'pct' ? fmt(v) + ' %' : money(v);
const commTxt = p => commVal(p, num(p.comm)) + (p.commCity && Object.keys(p.commCity).length ? ' · ' + Object.entries(p.commCity).map(([c,v]) => esc(c) + ' ' + commVal(p, num(v))).join(' · ') : '');
const payTxt = l => l.pay === 'salaire' ? 'Salaire ' + money(num(l.salary)) + ' / mois' : l.pay === 'pct' ? fmt(num(l.pct)) + ' % de chaque vente' : 'Commission selon le produit';
function inPer(date, p){
  if(p === 'tout') return true;
  const t = today();
  if(p === 'jour') return date === t;
  if(p === 'sem') return date >= weekStart() && date <= t;
  if(p === 'mois') return (date||'').slice(0,7) === t.slice(0,7);
  return true;
}
function livStats(id){
  const r = {got:0, back:0, sold:0, pend:0, lost:0, cash:0, paid:0, earned:0, commPaid:0, week:0, weekN:0, weekPot:0, weekByProd:{}, salMonth:0, nLiv:0, nPend:0, byProd:{}};
  const mo = today().slice(0,7);
  const ws = weekStart();
  const P = pid => r.byProd[pid] = r.byProd[pid] || {got:0, sold:0, pend:0, back:0, lost:0};
  for(const m of S.moves){
    if(m.liv !== id && m.loc !== id) continue;
    if(m.type === 'versement'){ r.paid += moneyUSD(m); continue; }
    if(m.type === 'paiecomm'){ r.commPaid += num(m.amount); continue; }
    if(m.type === 'depense'){ if(/^Salaire/.test(m.cat||'') && (m.date||'').slice(0,7) === mo) r.salMonth += moneyUSD(m); continue; }
    if(!m.pid) continue;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'envoi'){ r.got += q; P(pid).got += q; }
      else if(m.type === 'retour'){ r.back += q; P(pid).back += q; }
      else if(m.type === 'perte'){ r.lost += q; P(pid).lost += q; }
      else if(m.type === 'ajust'){ r.got += q; P(pid).got += q; }
      else if(m.type === 'vente' && m.status === 'livre'){ r.sold += q; P(pid).sold += q; }
      else if(m.type === 'vente' && m.status !== 'annule'){ r.pend += q; P(pid).pend += q; }
    }
    if(m.type === 'vente' && m.status === 'livre'){
      const c = m.qty * num(m.commU);
      r.cash += livCash(m); r.earned += c; r.nLiv++;
      if(m.date >= ws){ r.week += c; r.weekN++; const W = r.weekByProd[m.pid] = r.weekByProd[m.pid] || {q:0, c:0, a:0}; W.q += m.qty; W.c += c; W.a += saleUSD(m); }
    }
    if(m.type === 'vente' && (m.status === 'attente' || m.status === 'encours')){ r.nPend++; r.weekPot += m.qty * num(m.commU); }
  }
  r.hand = r.got - r.back - r.sold - r.lost - r.pend; // pièces encore en main (hors commandes en cours)
  r.handAll = r.hand + r.pend;                       // y compris les commandes en route
  r.toRemit = r.cash - r.paid;
  r.toPay = r.earned - r.commPaid;
  return r;
}
// jour comptable d'une vente : le jour de livraison (prévu) sinon le jour de la commande
// jour comptable d'une vente : le jour où on a touché « Livré » (ldate), sinon le jour de livraison prévu, sinon le jour de la commande
const mday = m => m.type === 'vente' ? (m.ldate || m.ddate || m.date) : m.date;
function stats(p){
  const r = {ca:0, nv:0, cost:0, comm:0, loss:0, dep:0, depCat:{}, pending:0, pendingAmt:0, byProd:{}, byCity:{}, days:{}};
  for(const m of S.moves){
    if(m.type === 'vente'){
      const a = saleUSD(m);
      if(m.status === 'attente' || m.status === 'encours'){ r.pending++; r.pendingAmt += a; }
      if(m.status === 'livre'){
        r.days[mday(m)] = (r.days[mday(m)]||0) + a;
        if(inPer(mday(m), p)){
          r.ca += a; r.nv++; r.cost += m.qty * num(m.costU); r.comm += m.liv ? m.qty * num(m.commU) : 0;
          const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += a;
          const city = m.liv ? (liv(m.liv)?.city || 'Sans ville') : 'Vente directe (dépôt)';
          const C = r.byCity[city] = r.byCity[city] || {n:0, a:0}; C.n++; C.a += a;
        }
      }
    } else if(m.type === 'perte' && inPer(m.date, p)) r.loss += m.qty * num(m.costU);
    else if(m.type === 'depense' && inPer(m.date, p)){ const a = moneyUSD(m); r.dep += a; r.depCat[m.cat] = (r.depCat[m.cat]||0) + a; }
  }
  r.marge = r.ca - r.cost;
  r.net = r.ca - r.cost - r.comm - r.loss - r.dep;
  return r;
}

// Par produit : entré, vendu (livré, packs décomposés), en cours, perdu ; packs vendus
let stockAsOf = '';
function prodFlow(moves = S.moves){
  const F = {}, g = id => F[id] = F[id] || {in:0, sold:0, pend:0, lost:0, packs:0};
  for(const m of moves){
    if(!m.pid) continue;
    if(m.type === 'vente' && m.status !== 'annule' && isKit(prod(m.pid)) && m.status === 'livre') g(m.pid).packs += m.qty;
    for(const [pid, q] of lines(m.pid, m.qty)){
      if(m.type === 'entree' || m.type === 'ajust') g(pid).in += q;
      else if(m.type === 'vente' && m.status === 'livre') g(pid).sold += q;
      else if(m.type === 'vente' && m.status !== 'annule') g(pid).pend += q;
      else if(m.type === 'perte') g(pid).lost += q;
    }
  }
  return F;
}

const norm = t => String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function bestProduct(text){
  const st = w => w.length > 4 ? w.replace(/(es|s|x)$/,'') : w;
  const toks = norm(text).replace(/[^a-z0-9]+/g,' ').split(' ').filter(Boolean).map(st);
  const T = ' ' + toks.join(' ') + ' ';
  const packWord = /\b(duo|kit|gamme|combo|ensemble|lot|pack|coffret)\b/.test(norm(text));
  let best = null, bs = 0;
  for(const p of S.products){
    const words = norm(p.name).replace(/[^a-z0-9]+/g,' ').split(' ').filter(w => w.length >= 3 && !['pour','avec','des','les','une','piece','pieces','pack'].includes(w)).map(st);
    if(!words.length) continue;
    const hit = words.filter(w => T.includes(' ' + w + ' ')).length;
    let sc = hit * 10 - (words.length - hit);
    if(isKit(p)) sc += packWord ? 15 : -2;
    if(hit && sc > bs){ bs = sc; best = p.id; }
  }
  return best;
}

  const city = lab(/^ville\s*[:=\-–]\s*(.+)$/i);
  o.addr = lab(/^(?:adresse(?:\s+(?:compl[èe]te|de\s+livraison))?|address|lieu|localisation|domicile)\s*[:=\-–]\s*(.+)$/i);

  if(o.pid && pline){ const P = prod(o.pid), qq = o.qty || 1;
    const usd = pline.match(/(\d+(?:[.,]\d+)?)\s*(?:\$|usd|dollars?)/i), fc = pline.match(/(\d[\d\s.]*\d|\d)\s*(?:fc|francs?)\b/i);

/* ---------- Alertes « À surveiller » (accueil) ---------- */
function alertsCard(st, low){
  const t = today(), y = addDays(t, -1), out = [];
  const late = S.moves.filter(m => m.type === 'vente' && (m.status === 'attente' || m.status === 'encours') && (m.ddate || m.date) < t);
  if(late.length) out.push(['nav:ventes', `🕒 ${late.length} livraison(s) en retard (date passée, pas encore livrée)`]);
  S.livreurs.forEach(l => {
    const s = livStats(l.id); if(s.toRemit <= 0.5) return;
    const lastV = S.moves.filter(m => m.type === 'versement' && m.liv === l.id).reduce((a,m) => m.date > a ? m.date : a, '');
    const oldSale = S.moves.some(m => m.type === 'vente' && m.status === 'livre' && m.liv === l.id && mday(m) <= y && mday(m) > lastV);
    if(oldSale) out.push([`liv:${l.id}`, `💰 ${esc(l.name)} n'a pas versé ${money(s.toRemit)} (ventes d'avant aujourd'hui)`]);
  });
  if(low.length) out.push(['nav:stock', `📦 ${low.length} produit(s) en stock bas ou en rupture`]);
  { const fs = forecast().soon.filter(x => !low.some(p => p.id === x.p.id)); if(fs.length) out.push(['nav:stock', `⏳ ${fs.length} produit(s) vont bientôt finir : ${fs.slice(0, 3).map(x => esc(x.p.name) + ' (' + fDays(x.days) + ')').join(', ')}`]); }
  { const cl = credits().filter(c => c.late); if(cl.length) out.push(['nav:credits', `💳 ${cl.length} client(s) en retard de paiement (crédit) : ${cl.slice(0, 3).map(c => esc(c.M.client || 'client')).join(', ')}`]); }
  const hh = String(new Date().getHours()).padStart(2, '0');
  const rems = S.moves.filter(m => m.type === 'vente' && (m.status === 'attente' || m.status === 'encours') && m.rem && m.rem.slice(0, 10) === t && m.rem.slice(11, 13) <= hh);
  rems.forEach(m => out.push([`sale:${m.id}`, `🔔 Rappel : ${esc(pname(m.pid))} × ${m.qty} pour ${esc(m.client || 'un client')} — livraison ${esc(whenTxt(m))}`]));
  const tom = S.moves.filter(m => m.type === 'vente' && (m.status === 'attente' || m.status === 'encours') && (m.ddate || m.date) === addDays(t, 1));
  if(tom.length) out.push(['nav:ventes', `📅 ${tom.length} commande(s) réservée(s) à livrer demain : ${tom.slice(0, 3).map(m => esc(m.client || pname(m.pid))).join(', ')}`]);
  const pr = promises().filter(p => p.date <= t);
  if(pr.length) out.push(['clientsprom', `🤝 ${pr.length} client(s) à relancer (promesse) : ${pr.slice(0,3).map(p => esc(p.client || p.phone)).join(', ')}`]);
  const due = plans().filter(p => p.date <= addDays(t, 2));
  if(due.length) out.push(['nav:stock', `🛒 ${due.length} achat(s) prévu(s) ${due.some(p => p.date < t) ? 'en retard' : 'à faire bientôt'} : ${due.slice(0,3).map(p => esc(pname(p.pid))).join(', ')}`]);
  if(!out.length) return '';
  return `<div class="card" style="margin-bottom:12px;border-left:4px solid var(--warn)"><b>⚠️ À surveiller</b>${out.map(([a,txt]) => `<button class="link" style="display:block;text-align:left;margin-top:7px;font-weight:600;color:var(--ink)" data-a="${a}">${txt} ›</button>`).join('')}</div>`;
}

/* ---------- Clients : historique et relance WhatsApp ---------- */
let clientTab = 'tous', clientQ = '', clientDay = '';
function clientsList(){
  const map = new Map();
  for(const m of S.moves){
    if(m.type !== 'vente') continue;
    const key = phoneNorm(m.phone) || norm0(m.client); if(!key) continue;
    const c = map.get(key) || {key, name:'', phone:'', addr:'', n:0, q:0, total:0, last:'', lastPid:'', prods:{}, moves:[], nAnn:0, lastAnn:'', annPid:'', annIds:[]};
    if(m.status === 'annule'){ c.nAnn++; c.annIds.push(m.id); if((m.date || '') >= c.lastAnn){ c.lastAnn = m.date || ''; c.annPid = m.pid; } if(!c.name) c.name = m.client || ''; if(!c.phone) c.phone = m.phone || ''; if(!c.addr) c.addr = m.addr || ''; map.set(key, c); continue; }
    c.n++; c.q += m.qty; if(m.status === 'livre') c.total += saleUSD(m);
    if((m.date || '') >= c.last){ c.last = m.date || ''; c.name = m.client || c.name; c.addr = m.addr || c.addr; c.phone = m.phone || c.phone; c.lastPid = m.pid; }
    c.prods[m.pid] = (c.prods[m.pid] || 0) + m.qty; c.moves.push(m.id);
    map.set(key, c);
  }
  return [...map.values()];
}

/* ---------- Bilan de la marchandise (depuis le début) ---------- */
function stockBilan(){
  const st = stockAt(), r = {inv:0, invQ:0, ca:0, soldCost:0, soldQ:0, lossCost:0, restQ:0, restBuy:0, restSell:0, comm:0, dep:0, byProd:[]};
  for(const m of S.moves){
    if(m.type === 'entree'){ const p = prod(m.pid); const c = num(m.cost) > 0 ? toUSD(num(m.cost), p && p.cur) : unitCostUSD(p); r.inv += m.qty * c; r.invQ += m.qty; }
    else if(m.type === 'vente' && m.status === 'livre'){ r.ca += saleUSD(m); r.soldCost += m.qty * num(m.costU); r.comm += m.liv ? m.qty * num(m.commU) : 0; }
    else if(m.type === 'perte') r.lossCost += m.qty * num(m.costU);
    else if(m.type === 'depense') r.dep += moneyUSD(m);
  }
  for(const p of S.products.filter(p => !isKit(p))){
    const q = Math.max(0, totalOf(st, p.id)); if(!q) continue;
    const b = q * unitCostUSD(p), v = q * toUSD(num(p.sell), p.cur);
    r.restQ += q; r.restBuy += b; r.restSell += v; r.byProd.push([p, q, b, v]);
  }
  r.recup = r.inv ? r.ca / r.inv * 100 : 0;
  r.netNow = r.ca - r.soldCost - r.comm - r.dep - r.lossCost;
  return r;
}
// Historique jour par jour : stock ajouté (date, produits, valeur), ventes, dépenses, cumuls
function stockHistory(){
  const days = {}, D = d => days[d] = days[d] || {d, addQ:0, addV:0, adds:{}, ca:0, n:0, dep:0, net:0};
  for(const m of S.moves){
    if(!m.date) continue;
    if(m.type === 'entree'){ const p = prod(m.pid), c = num(m.cost) > 0 ? toUSD(num(m.cost), p && p.cur) : unitCostUSD(p), x = D(m.date);
      x.addQ += m.qty; x.addV += m.qty * c; x.adds[m.pid] = (x.adds[m.pid] || 0) + m.qty; }
    else if(m.type === 'vente' && m.status === 'livre'){ const x = D(mday(m)), u = saleUSD(m); x.ca += u; x.n++; x.net += u - m.qty * num(m.costU) - (m.liv ? m.qty * num(m.commU) : 0); }
    else if(m.type === 'depense'){ const x = D(m.date), v = moneyUSD(m); x.dep += v; x.net -= v; }
    else if(m.type === 'perte'){ const x = D(m.date); x.net -= m.qty * num(m.costU); }
  }
  let inv = 0, ca = 0, net = 0;
  const list = Object.values(days).sort((a,b) => a.d.localeCompare(b.d));
  list.forEach(x => { inv += x.addV; ca += x.ca; net += x.net; x.inv = inv; x.cumCa = ca; x.cumNet = net; });
  return list.reverse();
}

/* ===== Confettis ===== */
function confetti(n){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(_){}
  const c = document.createElement('canvas'), x = c.getContext('2d'), W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  c.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:120'; document.body.appendChild(c);
  const cols = [getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#8A3B12', '#FBBF24', '#34D399', '#60A5FA', '#F472B6', '#ffffff'];
  const P = Array.from({length:n || 110}, () => ({x:W/2 + (Math.random()-.5)*W*.25, y:H*.35, vx:(Math.random()-.5)*18*devicePixelRatio, vy:(-Math.random()*16-6)*devicePixelRatio, s:(Math.random()*6+4)*devicePixelRatio, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t = 0; const step = () => { t++; x.clearRect(0,0,W,H);
    for(const p of P){ p.vy += .55*devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - t/110); x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6); x.restore(); }
    if(t < 110) requestAnimationFrame(step); else c.remove(); };
  requestAnimationFrame(step);
  try{ navigator.vibrate && navigator.vibrate([12,40,12]); }catch(_){}
}
function cheer(msg, n){ confetti(n); toast(msg); }
const onceKey = k => { const key = 'stock_cheer_' + (S.settings.shop||'') + '_' + k; try{ if(localStorage.getItem(key)) return false; localStorage.setItem(key, '1'); }catch(_){} return true; };

function caOf(from, to){ let t = 0; for(const m of S.moves) if(m.type === 'vente' && m.status === 'livre' && mday(m) >= from && mday(m) <= to) t += saleUSD(m); return t; }
function ringSVG(pct, col){ const r = 40, C = 2*Math.PI*r, p = Math.max(0, Math.min(1, pct)), off = C*(1-p);
  return `<svg class="ring" viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="${r}"/><circle class="fg" cx="50" cy="50" r="${r}" stroke="${col}" style="--c:${C.toFixed(1)}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/><text x="50" y="57" text-anchor="middle">${Math.round(pct*100)}%</text></svg>`; }
function netOf(from, to){ let t = 0; const IN = d => d >= from && d <= to;

    if(m.type === 'vente'){ if(m.status === 'livre' && IN(mday(m))) t += saleUSD(m) - m.qty*num(m.costU) - (m.liv ? m.qty*num(m.commU) : 0); }
    else if(m.type === 'perte' && IN(m.date)) t -= m.qty*num(m.costU);
    else if(m.type === 'depense' && IN(m.date)) t -= moneyUSD(m);
  } return t; }
function netRatio(){ const t = today(), a = addDays(t, -29), ca = caOf(a, t); return ca > 0 ? netOf(a, t) / ca : 0; }

    ${hasV && hasP ? `<div class="gsum">🏁 <b>Ensemble des objectifs</b> : ${eD !== null ? `aujourd'hui <b class="num">${eD} %</b>` : ''}${eD !== null && eM !== null ? ' · ' : ''}${eM !== null ? `ce mois <b class="num">${eM} %</b>` : ''}<br>

/* ===== Compteurs animés ===== */
function countUp(root){
  try{ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(_){}
  root.querySelectorAll('.kpi .v').forEach(el => {
    const txt = el.textContent, mm = txt.match(/^(-?)([\d\s  .]*\d(?:,\d+)?)(.*)$/); if(!mm) return;
    const dec = (mm[2].split(',')[1] || '').length, target = parseFloat(mm[2].replace(/[\s  .]/g,'').replace(',', '.')) * (mm[1] ? -1 : 1);
    if(!isFinite(target) || Math.abs(target) < 2) return;
    const f = v => (v < 0 ? '-' : '') + Math.abs(v).toLocaleString('fr-FR', {minimumFractionDigits:0, maximumFractionDigits:dec}) + mm[3];
    const t0 = performance.now(), D = 650; el.textContent = f(0);
    const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); el.textContent = k < 1 ? f(target * e) : txt; if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

/* ===== Graphiques ===== */
function areaChart(days){
  const W = 320, H = 130, n = days.length, mx = Math.max(1, ...days.map(d => d[1]));
  const X = i => n > 1 ? i * (W / (n - 1)) : W/2, Y = v => H - 8 - (v / mx) * (H - 24);
  const pts = days.map(([d,v], i) => [X(i), Y(v), d, v]);
  let path = `M ${pts[0][0]} ${pts[0][1]}`;
  for(let i = 1; i < pts.length; i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i], cx = (x0 + x1) / 2; path += ` C ${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`; }
  const area = path + ` L ${W} ${H} L 0 ${H} Z`;
  const best = pts.reduce((a,b) => b[3] > a[3] ? b : a, pts[0]);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brand)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    ${pts.map(([x,y,d,v]) => `<circle class="pt" cx="${x}" cy="${y}" r="${v ? 3.6 : 2.2}" fill="${v ? 'var(--brand)' : 'var(--line)'}" data-a="jourset:${d}" vector-effect="non-scaling-stroke"><title>${fmtDate(d)} : ${money(v)}</title></circle>`).join('')}
    </svg><div class="lbl">${days.map(([d], i) => `<span>${i % 2 === 0 || i === n-1 ? +d.slice(8) : ''}</span>`).join('')}</div>
    ${best[3] > 0 ? `<p class="note" style="margin-top:6px">Meilleur jour : <b>${fmtDate(best[2])}</b> · ${money(best[3])} — touchez un point pour voir le jour.</p>` : ''}</div>`;
}
function donutSVG(parts, total, center){
  const r = 42, C = 2*Math.PI*r; let acc = 0;
  const segs = parts.filter(p => p[1] > 0).map(([col, v]) => { const len = total ? v / total * C : 0, s = `<circle cx="60" cy="60" r="${r}" stroke="${col}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}"/>`; acc += len; return s; }).join('');
  return `<svg class="donut" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" stroke="var(--line)"/>${segs}<text x="60" y="58" text-anchor="middle" font-size="15">${center[0]}</text><text x="60" y="76" text-anchor="middle" font-size="10" style="font-weight:600;fill:var(--muted)">${center[1]}</text></svg>`;
}

/* ===== Gestes : glisser une vente, tirer pour actualiser ===== */
(() => {
  let sx = 0, sy = 0, el = null, dx = 0, mode = '', suppress = false, ptr = null;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; dx = 0; mode = '';
    el = e.target.closest('[data-sw]');
    if(!el && !document.body.classList.contains('lock') && scrollY <= 0 && !e.target.closest('#ov,#auth,input,textarea,select')) mode = 'ptr-wait';
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    const t = e.touches[0], ddx = t.clientX - sx, ddy = t.clientY - sy;
    if(el && !mode && Math.abs(ddx) > 12 && Math.abs(ddx) > Math.abs(ddy) * 1.3){ mode = 'sw'; const bg = document.createElement('div'); bg.className = 'swbg'; el.parentNode.insertBefore(bg, el); el._bg = bg; }
    if(mode === 'sw'){ dx = ddx; el.style.transform = `translateX(${dx}px)`; el.style.transition = 'none';
      const bg = el._bg; if(bg){ bg.style.top = el.offsetTop + 'px'; bg.style.height = el.offsetHeight + 'px'; bg.style.bottom = 'auto'; bg.className = 'swbg ' + (dx > 0 ? 'ok' : 'ko'); bg.innerHTML = dx > 0 ? '<span>✅ Livré</span><span></span>' : '<span></span><span>Annuler ✕</span>'; } }
    if(mode === 'ptr-wait' && ddy > 10 && Math.abs(ddy) > Math.abs(ddx)){ mode = 'ptr'; ptr = $('#ptr') || document.body.appendChild(Object.assign(document.createElement('div'), {id:'ptr', textContent:'↻'})); }
    if(mode === 'ptr'){ dx = ddy; ptr.classList.toggle('on', ddy > 30); ptr.style.transform = `rotate(${Math.min(ddy, 120) * 3}deg) scale(${ddy > 70 ? 1.1 : 1})`; }
  }, {passive:true});
  document.addEventListener('touchend', () => {
    if(mode === 'sw' && el){ const id = el.dataset.sw, bg = el._bg; suppress = true; setTimeout(() => suppress = false, 350);
      el.style.transition = 'transform .2s'; el.style.transform = '';
      setTimeout(() => { if(bg) bg.remove(); }, 220);
      if(dx > 90) setStatus(id, 'livre', true);
      else if(dx < -90) ask('Annuler cette vente ? Le stock sera remis.', 'Oui, annuler').then(ok => { if(ok) setStatus(id, 'annule', true); });
    }
    if(mode === 'ptr' && ptr){ const go = dx > 70; ptr.classList.add(go ? 'go' : 'x'); ptr.style.transform = '';
      if(go){ Promise.resolve(typeof syncNow === 'function' ? syncNow() : null).catch(() => {}).then(() => { render(); toast('Actualisé ✅'); setTimeout(() => ptr.classList.remove('on','go'), 200); }); }
      else ptr.classList.remove('on','x'); }
    el = null; mode = ''; dx = 0;
  }, {passive:true});
  document.addEventListener('click', e => { if(suppress && e.target.closest('[data-sw]')){ e.stopPropagation(); e.preventDefault(); } }, true);
  // petite vibration au toucher (Android)
  document.addEventListener('click', e => { if(navigator.vibrate && e.target.closest('.btn,button.it,nav.nav button,.fab,.chip,button.kpi')) try{ navigator.vibrate(8); }catch(_){} }, true);

/* ---------- Taux de réussite & classement ---------- */
let rankPer = 'sem';
function taux(lid, per){
  const r = {done:0, ko:0, pend:0, ca:0, comm:0};
  for(const m of S.moves) if(m.type === 'vente' && m.liv === lid && inPer(mday(m), per)){
    if(m.status === 'livre'){ r.done++; r.ca += saleUSD(m); r.comm += m.qty * num(m.commU); }
    else if(m.status === 'annule') r.ko++; else r.pend++;
  }
  r.pct = r.done + r.ko ? Math.round(r.done / (r.done + r.ko) * 100) : 0;
  return r;
}
function rankHTML(){
  const rows = S.livreurs.map(l => [l, taux(l.id, rankPer)]).sort((a,b) => b[1].ca - a[1].ca || b[1].done - a[1].done);

  return `<div class="sec"><h2>Classement & taux de réussite</h2></div>

function cleanPhone(t){ const x = String(t||'').match(/(\+?\d[\d .\-()]{6,}\d)/); if(!x) return ''; let p = x[1].replace(/[ .\-()]/g,''); if(/^243\d{9}$/.test(p)) p = '+' + p; return p; }

/* ---------- Rapport du jour ---------- */
let jourDate = '';
function dayReport(d){
  const r = {d, n:0, pcs:0, ca:0, cost:0, comm:0, dep:0, loss:0, vers:0, byPay:{}, byProd:{}, sales:[], pend:0, pendAmt:0};
  for(const m of S.moves){
    if(mday(m) !== d) continue;
    if(m.type === 'vente' && m.status === 'livre'){
      const u = saleUSD(m), c = m.liv ? m.qty * num(m.commU) : 0;
      r.n++; r.pcs += m.qty; r.ca += u; r.cost += m.qty * num(m.costU); r.comm += c; r.sales.push(m);
      const k = m.liv ? 'Par les livreurs' : (m.pay || 'Non précisé'); r.byPay[k] = (r.byPay[k] || 0) + u;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0}; P.q += m.qty; P.a += u;
    } else if(m.type === 'vente' && (m.status === 'attente' || m.status === 'encours')){ r.pend++; r.pendAmt += saleUSD(m); }
    else if(m.type === 'depense') r.dep += moneyUSD(m);
    else if(m.type === 'perte') r.loss += m.qty * num(m.costU);
    else if(m.type === 'versement') r.vers += moneyUSD(m);
  }
  r.sales.sort((a,b) => (a.dtime||'').localeCompare(b.dtime||'') || (a.ts||0) - (b.ts||0));
  r.net = r.ca - r.cost - r.comm - r.dep - r.loss;
  return r;
}
const dayName = d => new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
function jourText(r){
  const P = Object.entries(r.byProd).sort((x,y) => y[1].a - x[1].a).map(([id,v]) => `• ${pname(id)} : ${v.q} pièce(s) · ${money(v.a)}`).join('\n');
  const Y = Object.entries(r.byPay).map(([k,v]) => `• ${k} : ${money(v)}`).join('\n');
  return `*${S.settings.shop} — Rapport du jour*\n${dayName(r.d)}\n\nVentes : ${r.n} (${r.pcs} pièce(s)) — *${money(r.ca)}*\n${Y ? Y + '\n' : ''}\nCoût des produits : ${money(r.cost)}${r.comm ? '\nCommissions livreurs : ' + money(r.comm) : ''}\nDépenses du jour : ${money(r.dep)}${r.loss ? '\nPertes : ' + money(r.loss) : ''}\n*Bénéfice du jour : ${money(r.net)}*${r.vers ? '\nVersements reçus des livreurs : ' + money(r.vers) : ''}\n\n*Produits vendus*\n${P || '• aucune vente'}`;
}

  const d = jourDate || today(), r = dayReport(d), txt = jourText(r);

    <div class="kpi"><div class="l">Bénéfice du jour</div><div class="v num ${r.net<0?'neg':''}">${money(r.net)}</div><div class="s">après coûts et dépenses</div></div>

let relLiv = '', relWeek = 0;
const dAbs = (iso, long) => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', long ? {weekday:'long', day:'numeric', month:'long', year:'numeric'} : {day:'numeric', month:'short'});
function releveData(lid, k){
  const l = liv(lid), [a, b] = weekRange(k), inR = d => d >= a && d <= b;
  const r = {l, a, b, sales:[], byProd:{}, n:0, pcs:0, cash:0, comm:0, vers:0, commPaid:0, sal:0};
  for(const m of sortMoves(S.moves.filter(m => m.liv === lid && inR(mday(m)))).reverse()){
    if(m.type === 'vente' && m.status === 'livre'){
      const u = saleUSD(m), c = m.qty * num(m.commU);
      r.sales.push(m); r.n++; r.pcs += m.qty; r.cash += livCash(m); r.comm += c;
      const P = r.byProd[m.pid] = r.byProd[m.pid] || {q:0, a:0, c:0}; P.q += m.qty; P.a += u; P.c += c;
    } else if(m.type === 'versement') r.vers += moneyUSD(m);
    else if(m.type === 'paiecomm') r.commPaid += num(m.amount);
    else if(m.type === 'depense' && /^Salaire/.test(m.cat||'')) r.sal += moneyUSD(m);
  }
  r.s = livStats(lid);
  return r;
}
// Taux appliqué à une vente : « 10 % » ou « 2 $ / pièce »
function rateTxt(m, l){
  const cu = num(m.commU); if(!cu) return '—';
  const p = prod(m.pid), unit = m.qty ? saleUSD(m) / m.qty : 0;
  if((l && l.pay === 'pct') || (p && p.commMode === 'pct')) return unit ? fmt(cu / unit * 100) + ' %' : money(cu);
  return money(cu) + ' / pièce';
}
function releveText(r){
  const l = r.l, sal = l.pay === 'salaire';
  const P = Object.entries(r.byProd).map(([id,v]) => `• ${pname(id)} : ${v.q} pièce(s) · ${money(v.a)}${sal ? '' : ' → ' + money(v.c)}`).join('\n');
  return `*${S.settings.shop} — Relevé de la semaine*\n${l.name} (${l.city||''})\nDu ${dAbs(r.a, 1)} au ${dAbs(r.b, 1)}\nMode : ${payTxt(l)}\n\n*Livraisons*\n${P || '• aucune livraison'}\n\nVentes livrées : ${r.n} (${r.pcs} pièce(s)) — ${money(r.cash)}\n${sal ? '' : `*Commission de la semaine : ${money(r.comm)}*\nCommission payée cette semaine : ${money(r.commPaid)}\n`}Versé à la boutique cette semaine : ${money(r.vers)}\n\n${sal ? '' : `Commission restant à payer (total) : ${money(r.s.toPay)}\n`}*Argent restant à verser (total) : ${money(r.s.toRemit)}*\n\nMerci pour votre travail 🙏`;
}

  const drawX = () => { const box = $('#xlines'); if(!box) return;

      return `<div class="card" style="padding:10px 12px;margin-bottom:8px"><div style="display:flex;gap:8px;align-items:center"><b style="flex:none">${i + 2}.</b><label class="f" style="flex:1;min-width:0;margin:0"><select data-xi="${i}" data-xk="pid">${prods.filter(p => p.id).map(p => `<option value="${p.id}" ${p.id === x.pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label><button type="button" class="btn sm ghost-bad" data-xdel="${i}" title="Retirer">✕</button></div>
        <div class="row2" style="margin-top:8px">${field('Quantité', `<input type="number" min="1" step="1" data-xi="${i}" data-xk="qty" value="${x.qty}">`)}${field('Prix unitaire' + (P && P.cur === 'FC' ? ' (' + LC() + ')' : ' ($)'), `<input type="number" step="any" min="0" data-xi="${i}" data-xk="price" value="${x.price}">`)}</div></div>`; }).join('');
    upd(); };
  if($('#xadd')){
    $('#xadd').onclick = () => { const P = prods.find(p => p.id !== E.pid.value) || prods[0]; if(!P) return; xl.push({pid:P.id, qty:1, price:num(P.sell)}); drawX(); };
    const xbox = $('#xlines');
    xbox.addEventListener('input', e => { const t = e.target, i = +t.dataset.xi; if(isNaN(i) || !xl[i]) return; if(t.dataset.xk === 'qty') xl[i].qty = Math.max(0, Math.round(num(t.value))); if(t.dataset.xk === 'price') xl[i].price = num(t.value); upd(); });
    xbox.addEventListener('change', e => { const t = e.target, i = +t.dataset.xi; if(t.dataset.xk !== 'pid' || !xl[i]) return; const P = prod(t.value); xl[i].pid = t.value; xl[i].price = num(P && P.sell); drawX(); });
    xbox.addEventListener('click', e => { const b = e.target.closest('[data-xdel]'); if(!b) return; xl.splice(+b.dataset.xdel, 1); drawX(); });
  }
  E.pid.onchange = () => { const p = prod(E.pid.value); if(p){ if(E.price) E.price.value = p.sell || ''; if(E.cost) E.cost.value = num(p.buy) || ''; } upd(); };
  if(E.loc) E.loc.onchange = () => { if(type === 'vente' && !m){ status = E.loc.value ? 'attente' : 'livre'; paintSeg(); } upd(); };
  E.qty.oninput = upd; if(E.price) E.price.oninput = upd;
  if(E.rem){
    const remCalc = k => { const d = E.ddate.value || today(), t = E.dtime.value;
      if(k === 'veille') return addDays(d, -1) + 'T18:00';
      if(k === 'matin') return d + 'T08:00';
      if(k === '1h'){ if(!t){ toast('Indiquez d\'abord l\'heure de livraison'); return null; } const h = Math.max(0, +t.slice(0, 2) - 1); return d + 'T' + String(h).padStart(2, '0') + ':00'; }
      return E.rem.value || d + 'T08:00'; };
    const paintRem = () => { const v = E.rem.value; $('#remTxt').innerHTML = v ? `🔔 Notification le <b>${esc(dAbs(v.slice(0, 10), 1))} à ${v.slice(11, 13)} h</b>` : ''; };
    $('#remChips').onclick = e => { const b = e.target.closest('[data-rem]'); if(!b) return; const k = b.dataset.rem;
      [...$('#remChips').children].forEach(x => x.classList.toggle('on', x === b));
      if(!k){ E.rem.value = ''; E.rem.style.display = 'none'; paintRem(); return; }
      const v = remCalc(k); if(v == null) return; E.rem.value = v; E.rem.style.display = k === 'autre' ? '' : 'none'; paintRem(); };
    E.rem.oninput = paintRem; paintRem();
    if(m && m.rem) [...$('#remChips').children].forEach(x => x.classList.toggle('on', x.dataset.rem === 'autre')); else [...$('#remChips').children][0].classList.add('on');
  }
  if(E.shipOn){
    const on = () => { E.shipOn.checked = true; upd(); };
    E.shipOn.onchange = upd; E.shipFee.oninput = on; E.shipCur.onchange = upd; E.pre.onchange = upd;
    E.shipCity.oninput = () => { const c = E.shipCity.value.trim().toLowerCase(), L = liv(E.loc.value);
      const t = ships().filter(t => (t.city || '').toLowerCase() === c).sort((a, b) => ((b.from && L && b.from === L.city) ? 1 : 0) - ((a.from && L && a.from === L.city) ? 1 : 0))[0];
      if(t){ setPick(E.shipCo, t.co || ''); E.shipFee.value = t.fee; E.shipCur.value = t.cur || 'FC'; }
      if(c) E.shipOn.checked = true; upd(); };
    if(E.shipT) E.shipT.onchange = () => { const t = ships().find(x => x.id === E.shipT.value); if(t){ setPick(E.shipCity, t.city); setPick(E.shipCo, t.co || ''); E.shipFee.value = t.fee; E.shipCur.value = t.cur || 'FC'; E.shipOn.checked = true; } upd(); };
  }
  if(!m && pid0) E.pid.onchange(); else upd();
  let extras = [];
  if($('#pasteGo')) $('#pasteGo').onclick = () => {
    const txt = $('#pasteTx').value.trim(); if(!txt){ toast('Collez d\'abord le message du client'); return; }
    const o = parseOrder(txt), got = [], miss = [];
    const set = (n, v, lab) => { if(v){ E[n].value = v; got.push(lab); } else miss.push(lab); };
    if(o.pid){ E.pid.value = o.pid; E.pid.onchange(); got.push('produit'); } else miss.push('produit');
    if(o.qty) E.qty.value = o.qty;
    set('client', o.client, 'nom'); set('phone', o.phone, 'téléphone'); set('addr', o.addr, 'adresse');
    if(o.ddate) E.ddate.value = o.ddate;
    set('dtime', o.dtime, 'heure');
    if(o.liv && E.loc){ E.loc.value = o.liv; E.loc.onchange(); got.push('livreur (' + o.city + ')'); }
    if(o.price && E.price){ E.price.value = o.price; got.push('prix'); }
    if(o.when && (!o.dtime || o.slot)) E.note.value = (E.note.value ? E.note.value + ' · ' : '') + 'Livraison : ' + o.when;
    upd();
    extras = o.items && o.items.length > 1 ? o.items.slice(1) : [];
    xl.length = 0; extras.filter(x => prod(x.pid)).forEach(x => xl.push({pid:x.pid, qty:x.qty || 1, price:x.price != null ? num(x.price) : num(prod(x.pid).sell)})); drawX();
    $('#pasteMsg').innerHTML = (extras.length ? `<b>🛒 Commande de ${o.items.length} produits :</b> le 1er est rempli ci-dessous, ${extras.map(x => esc(pname(x.pid)) + ' × ' + x.qty).join(', ')} ${extras.length > 1 ? 'sont ajoutés' : 'est ajouté'} en dessous (vérifiez les quantités et les prix).<br>` : '') + (got.length ? '✅ Rempli : ' + got.join(', ') + '. ' : '') + (miss.length ? '<span class="red">À compléter : ' + miss.join(', ') + '.</span>' : '') + ' Vérifiez avant d\'enregistrer.';
  };

  f.onsubmit = e => {
    e.preventDefault();
    const p = prod(E.pid.value); if(!p){ toast('Choisissez un produit'); return; }
    const qty = Math.round(num(E.qty.value)); if(qty < 1){ toast('Quantité invalide'); return; }
    const rec = Object.assign({}, m || {id:uid(), ts:Date.now(), type});
    rec.pid = p.id; rec.qty = qty; rec.date = E.date.value || today(); rec.note = E.note.value.trim();
    if(type === 'envoi' || type === 'retour'){ rec.liv = E.loc.value; if(!rec.liv){ toast('Choisissez un livreur'); return; } }
    if(type === 'entree'){ rec.cost = num(E.cost.value); }
    if(type === 'perte'){ rec.loc = E.loc.value; rec.motif = E.motif.value; if(!m || m.pid !== p.id) rec.costU = unitCostUSD(p); }
    if(type === 'vente'){
      rec.liv = E.loc.value; rec.price = num(E.price.value); rec.cur = p.cur;
      if(!m || m.pid !== p.id) rec.costU = unitCostUSD(p);
      if(!m || m.pid !== p.id || m.liv !== rec.liv || m.price !== rec.price) rec.commU = commUFor(p, liv(rec.liv), toUSD(rec.price, p.cur, m && m.cur === p.cur ? m.rate : rate()));
      if(!m || m.pid !== p.id || m.cur !== p.cur) rec.rate = rate();
      rec.client = E.client.value.trim(); rec.phone = E.phone.value.trim(); rec.addr = E.addr.value.trim(); rec.status = status;
      if(E.credit && E.credit.checked){ rec.credit = true; if(!m || m.creditMain || !m.credit){ rec.creditMain = true; rec.acompte = num(E.acompte.value); rec.dueDate = E.dueDate.value || ''; } }
      else if(E.credit){ delete rec.credit; delete rec.creditMain; delete rec.acompte; delete rec.dueDate; delete rec.cpays; }
      rec.ddate = E.ddate.value || rec.date; rec.dtime = E.dtime.value; if(E.rem && E.rem.value) rec.rem = E.rem.value.slice(0, 13) + ':00'; else delete rec.rem; rec.pay = E.pay ? E.pay.value : (rec.pay || '');
      if(rec.status === 'livre'){ if(!m) rec.ldate = rec.ddate; else if(m.status !== 'livre') rec.ldate = today(); else if(m.ddate !== rec.ddate) rec.ldate = rec.ddate; } else delete rec.ldate;
    }
    let shipRec = null, preOn = false;
    if(type === 'vente' && E.shipOn){
      if(E.shipOn.checked){ shipRec = {city:E.shipCity.value.trim(), co:E.shipCo.value.trim(), fee:num(E.shipFee.value), cur:E.shipCur.value}; preOn = E.pre.checked; addShipCo(shipRec.co); if(!shipRec.city){ toast('Indiquez la ville de destination de l\'expédition'); return; } }
      delete rec.ship; if(preOn){ rec.pre = true; if(!rec.pay) rec.pay = 'Mobile Money'; } else delete rec.pre;
    }
    let next = m ? S.moves.map(x => x.id === m.id ? rec : x) : S.moves.concat([rec]);
    const oid = m ? (m.ord || m.id) : rec.id;
    const more = type === 'vente' ? xl.filter(x => prod(x.pid) && x.qty > 0).map((x, i) => { const P = prod(x.pid);
      rec.ord = oid; return Object.assign({}, rec, {id:uid(), ord:oid, ts:Date.now() + i + 1, pid:P.id, qty:x.qty, price:x.price, cur:P.cur, rate:rate(), costU:unitCostUSD(P), commU:commUFor(P, liv(rec.liv), toUSD(x.price, P.cur))}); }) : [];
    more.forEach(x => { delete x.ship; delete x.rem; delete x.creditMain; delete x.acompte; delete x.dueDate; delete x.cpays; });
    next = next.concat(more);
    if(type === 'vente' && E.shipOn){
      // une seule ligne de la commande porte l'expédition ; « payé d'avance » vaut pour toute la commande
      const og = rec.ord || (m && m.ord) || null;
      const grp = og ? next.filter(x => x.type === 'vente' && x.ord === og) : [rec];
      const holder = grp.find(x => x.ship && x.id !== rec.id) || rec;
      next = next.map(x => { if(!grp.some(g => g.id === x.id)) return x; const y = x === rec || more.includes(x) ? x : Object.assign({}, x); delete y.ship; if(preOn){ y.pre = true; if(!y.pay) y.pay = 'Mobile Money'; } else delete y.pre; if(shipRec && y.id === holder.id) y.ship = shipRec; return y; });
    }
    const err = checkStock(next, [p.id].concat(m ? [m.pid] : []).concat(more.map(x => x.pid)));
    if(err){ toast(err); return; }
    S.moves = next;
    if(type === 'entree' && !m && rec.cost > 0) p.buy = rec.cost;
    if(type === 'entree' && !m && opt.plan){ const pl = S.moves.find(x => x.id === opt.plan); if(pl) pl.done = rec.date; }
    S.settings.setup = true; save();
    toast(m ? 'Modification enregistrée' + (more.length ? ` · ${more.length} produit(s) ajouté(s) à la commande` : '') : more.length ? `${more.length + 1} ventes enregistrées (une par produit)` : {entree:'Entrée ajoutée au dépôt', envoi:'Stock envoyé au livreur', retour:'Retour enregistré', vente:'Vente enregistrée', perte:'Sortie enregistrée'}[type]);
    if(type === 'vente' && !m){ if(window.onSaleCreated) try{ onSaleCreated(rec); }catch(_){} saleTab = status; render(); saleSheet(rec.id, true); }
    else if((type === 'envoi' || type === 'retour') && opt.liv){ render(); livSheet(opt.liv); }
    else { closeSheet(); render(); }
  };
}

/* ----- Argent : versement, paiement commission, dépense ----- */
function moneyForm(type, opt = {}){
  const m = opt.id ? S.moves.find(x => x.id === opt.id) : null;
  if(m) type = m.type;
  if((type === 'versement' || type === 'paiecomm') && !S.livreurs.length){ toast("Ajoutez d'abord un livreur"); livForm(); return; }
  const liv0 = m?.liv || opt.liv || '';
  const livOpts = cities().map(c => `<optgroup label="${esc(c)}">${S.livreurs.filter(l => (l.city||'Sans ville') === c).sort(byName).map(l => `<option value="${l.id}" ${l.id===liv0?'selected':''}>${esc(l.name)}</option>`).join('')}</optgroup>`).join('');
  const T = {versement:['Versement d\'un livreur','Enregistrer le versement'], paiecomm:['Payer la commission','Enregistrer le paiement'], depense:['Dépense','Enregistrer la dépense']}[type];
  let h = `<form id="nf">`;
  if(type === 'depense') h += field('Catégorie', `<select name="cat">${DEPCATS.map(c => `<option ${(m ? m.cat : opt.cat)===c?'selected':''}>${c}</option>`).join('')}</select>`);
  if(type === 'depense') h += field('Concerne un livreur ? (optionnel)', `<select name="liv"><option value="">Non</option>${livOpts}</select>`);
  else h += field('Livreur *', `<select name="liv" required>${liv0 ? '' : '<option value="">Choisir un livreur…</option>'}${livOpts}</select>`);
  h += `<div id="due"></div><div class="row2">${field('Montant *', `<input name="amount" type="number" step="any" min="0" required value="${m ? m.amount : ''}">`)}
    ${type === 'paiecomm' ? field('Devise', `<select name="cur" disabled><option>$</option></select>`) : field('Devise', `<select name="cur"><option value="$" ${m?.cur!=='FC'?'selected':''}>$</option><option value="FC" ${m?.cur==='FC'?'selected':''}>${esc(LC())}</option></select>`)}</div>
    <div class="row2">${field('Date', `<input name="date" type="date" required value="${m ? m.date : today()}">`)}${field('Note', `<input name="note" value="${esc(m?.note)}" placeholder="${type==='versement'?'Ex : M-Pesa, Airtel Money':'Optionnel'}">`)}</div>
    <button class="btn primary block">${T[1]}</button>
    ${m ? `<button type="button" class="btn ghost-bad block" style="margin-top:8px" data-a="delmove:${m.id}">Supprimer</button>` : ''}</form>`;
  sheet(T[0], h);
  const f = $('#nf'), E = f.elements;
  const upd = () => {
    if(type === 'depense' || !E.liv.value){ $('#due').innerHTML = ''; return; }
    const s = livStats(E.liv.value), dueU = type === 'versement' ? s.toRemit + (m ? moneyUSD(m) : 0) : s.toPay + (m ? num(m.amount) : 0);
    $('#due').innerHTML = `<button type="button" class="tot" style="width:100%;text-align:left" id="fill"><span>${type==='versement'?'Reste à verser':'Commission à payer'}</span><b class="num">${money(dueU)}</b><small>${type==='versement' ? '≈ ' + fcOf(dueU) + ' · ' : 'Cette semaine : ' + money(s.week) + ' · '}touchez pour remplir</small></button>`;
    $('#fill').onclick = () => { if(type === 'versement' && E.cur.value === 'FC') E.amount.value = Math.round(dueU * rate()); else E.amount.value = r2(dueU); };
  };
  E.liv.onchange = upd; upd();
  f.onsubmit = e => {
    e.preventDefault();
    const a = num(E.amount.value); if(!(a > 0)){ toast('Montant invalide'); return; }
    const rec = Object.assign({}, m || {id:uid(), ts:Date.now(), type});
    rec.liv = E.liv.value; rec.amount = a; rec.cur = type === 'paiecomm' ? '$' : E.cur.value; rec.date = E.date.value || today(); rec.note = E.note.value.trim();
    if(!m || m.cur !== rec.cur) rec.rate = rate();
    if(type === 'depense') rec.cat = E.cat.value;
    if(type !== 'depense' && !rec.liv){ toast('Choisissez un livreur'); return; }
    S.moves = m ? S.moves.map(x => x.id === m.id ? rec : x) : S.moves.concat([rec]);
    save(); toast(m ? 'Modification enregistrée' : {versement:'Versement enregistré ✅', paiecomm:'Commission payée ✅', depense:'Dépense enregistrée'}[type]);
    if(!m && type === 'versement' && livStats(rec.liv).toRemit <= 0.009) setTimeout(() => cheer('🎉 ' + lname(rec.liv) + ' a tout versé. Compte à zéro !', 120), 300);
    if(opt.liv && !m){ render(); livSheet(opt.liv); } else { closeSheet(); render(); }
  };
}

/* ----- Détail d'une vente ----- */
function saleSheet(id, fresh){
  const m = S.moves.find(x => x.id === id); if(!m) return;
  const L = liv(m.liv), total = amt(m.qty*m.price, m.cur), u = saleUSD(m);
  const rc = receiptClient(m), rl = receiptLivreur(m);
  sheet(fresh ? 'Vente enregistrée ✅' : 'Vente', `
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div style="font-weight:700;font-size:16px">${esc(pname(m.pid))} × ${m.qty} · ${total}</div><div class="note">${esc(m.client || 'Client')} · 📅 ${whenTxt(m)}</div></div><span class="pill p-${m.status}">${STATUS[m.status]}</span></div>
    </div>
    ${(() => { const ol = orderLines(m); if(ol.length < 2) return ''; const tot = {}; ol.forEach(it => tot[it.cur] = (tot[it.cur] || 0) + it.qty*it.price);
      return `<div class="card" style="margin-bottom:12px"><b>🛒 Commande de ${ol.length} produits</b><div class="list" style="margin-top:8px">${ol.map(it => `<button class="it" data-a="sale:${it.id}" style="${it.id === m.id ? 'background:var(--brand-soft,#eef)' : ''}"><div class="m"><div class="t">${esc(pname(it.pid))} × ${it.qty}</div><div class="d">${amt(it.qty*it.price, it.cur)} · ${STATUS[it.status] || ''}</div></div></button>`).join('')}</div><div class="dl strong" style="margin-top:6px"><span>Total de la commande</span><span class="num">${Object.entries(tot).map(([cu, v]) => amt(v, cu)).join(' + ')}</span></div></div>`; })()}
    ${m.credit ? (() => { const c = creditInfo(m); return `<button class="card" data-a="credsheet:${c.M.id}" style="width:100%;text-align:left;margin-bottom:12px;${c.done ? '' : 'border:2px solid var(--bad,#dc2626)'}"><b>💳 Vente à crédit</b> — ${c.done ? '✅ réglée' : `reste à payer <b class="red">${amt(c.reste, c.cur)}</b> sur ${amt(c.total, c.cur)}${c.due ? ' · promis le ' + fmtDate(c.due) : ''}`}<br><span class="note">Touchez pour encaisser un paiement ou envoyer un rappel</span></button>`; })() : ''}
    <div class="sec" style="margin-top:4px"><h2>Envoyer les reçus par WhatsApp</h2></div>
    <div class="stack" style="margin-bottom:6px">
      ${L ? `<a class="btn wa block" href="${waLink(L.phone, rl)}" target="_blank" rel="noopener">${ico('wa')} 1. Bon de livraison → ${esc(L.name)}${L.phone ? '' : ' (choisir le contact)'}</a>` : ''}
      <a class="btn wa block" href="${waLink(m.phone, rc)}" target="_blank" rel="noopener">${ico('wa')} ${L ? '2. ' : ''}Reçu → ${esc(m.client || 'client')}${m.phone ? '' : ' (choisir le contact)'}</a>
      <button class="btn block" data-a="recimg:${m.id}">🧾 Facture en image (logo, N°, détails)</button>
    </div>
    <details class="card" style="margin:10px 0 12px"><summary class="note"><b>Voir les messages qui seront envoyés</b></summary>
      ${L ? `<p class="note" style="margin-top:8px"><b>Au livreur :</b></p><pre class="msg">${esc(rl)}</pre>` : ''}
      <p class="note" style="margin-top:8px"><b>Au client :</b></p><pre class="msg">${esc(rc)}</pre></details>
    <div class="f"><span>Statut</span><div class="seg">${Object.entries(STATUS).map(([k,l]) => `<button type="button" class="${m.status===k?'on':''}" data-a="status:${k}" data-id="${m.id}">${l}</button>`).join('')}</div></div>
    ${(m.status === 'attente' || m.status === 'encours') && isKit(prod(m.pid)) ? `<button class="btn block" style="margin:-4px 0 12px" data-a="ownswap:${m.id}">🔁 Le client a pris seulement une partie du pack</button>` : ''}
    ${m.status === 'annule' && m.cancelReason ? `<p class="note" style="margin:-4px 0 12px;color:var(--bad,#dc2626)">❌ Annulé${m.cancelBy === 'livreur' ? ' par ' + esc(lname(m.liv)) : ''}${m.cancelAt ? ' le ' + fmtDate(m.cancelAt) : ''} : <b>${esc(m.cancelReason)}</b></p>` : ''}
    ${m.postponed && m.status !== 'livre' && m.status !== 'annule' ? `<p class="note" style="margin:-4px 0 12px">📅 Reportée ${m.postponed} fois${m.postponeReason ? ' : <b>' + esc(m.postponeReason) + '</b>' : ''}</p>` : ''}
    ${m.swapped ? `<p class="note" style="margin:-4px 0 12px">🔁 Commande initiale : <b>${esc(pname(m.origPid))} × ${m.origQty}</b> (${amt(m.origQty * num(m.origPrice), m.cur)}) → livré : <b>${esc(pname(m.pid))} × ${m.qty}</b></p>` : ''}
    ${(m.status === 'attente' || m.status === 'encours') && m.qty > 1 ? `<button class="btn block" style="margin:-4px 0 12px" data-a="ownpart:${m.id}">🔢 Livré en partie (le client a pris moins)</button>` : ''}
    ${m.partial ? `<p class="note" style="margin:-4px 0 12px">🔢 Livré en partie : <b>${m.qty} sur ${m.qtyAsked}</b> commandé(s)</p>` : ''}
    ${(() => { const ol = orderLines(m).filter(x => x.status !== 'annule' && x.status !== 'livre'); return ol.length > 1 ? `<button class="btn ghost-bad block" style="margin:-4px 0 12px" data-a="cancelorder:${m.id}">❌ Annuler toute la commande (${ol.length} produits)</button>` : ''; })()}
    ${m.status === 'annule' && (m.phone || m.client) ? `<button class="btn block" style="margin:-4px 0 12px" data-a="promsale:${m.id}">🤝 Relancer ce client plus tard (noter une promesse)</button>` : ''}
    ${m.status === 'livre' ? `<button class="btn block" style="margin:-4px 0 12px" data-a="ldate:${m.id}">✅ Livrée ${fmtDate(mday(m), true)} · changer la date</button>` : ''}

// Pack : le client n'a pris qu'une partie (ex. Pommade seule au lieu de Huile + Pommade) — prix du catalogue
function swapSheet(m, onOk){
  const P = prod(m.pid), t = today(); if(!isKit(P)) return;

    <form id="swf"><div class="f"><span>Qu'est-ce que le client a pris ?</span><div class="list">${comps.map(([x, mx], i) => `<label class="it" style="cursor:pointer"><input type="radio" name="pid" value="${x.id}" ${i ? '' : 'checked'} data-max="${mx}" style="width:22px;height:22px;min-height:0;flex:none"><div class="m"><div class="t">${esc(x.name)}</div><div class="d">Prix normal : ${amt(num(x.sell), x.cur)}</div></div></label>`).join('')}</div></div>
    ${field('Quantité prise', `<input name="q" type="number" min="1" step="1" value="${Math.max(1, comps[0] ? Math.min(m.qty, comps[0][1]) : 1)}" required inputmode="numeric">`)}
    ${field('Livré le', `<input name="d" type="date" max="${t}" value="${t}">`)}
    <div id="swSum" class="note" style="margin:-4px 0 12px"></div>
    <button class="btn primary block">✅ Confirmer : livré</button></form>`);
  const f = $('#swf'), E = f.elements, cur = () => f.querySelector('[name=pid]:checked');
  const up = () => { const r = cur(), x = r && prod(r.value), q = Math.round(num(E.q.value)), mx = r ? +r.dataset.max : 0;
    E.q.max = mx; $('#swSum').innerHTML = x && q >= 1 && q <= mx ? `Montant encaissé : <b>${amt(q * num(x.sell), x.cur)}</b> au lieu de ${amt(m.qty * m.price, m.cur)} · le reste du pack reste en stock` : `<span style="color:var(--bad,#dc2626)">Quantité entre 1 et ${mx}</span>`; };
  f.addEventListener('change', up); E.q.oninput = up; up();
  f.onsubmit = async e => { e.preventDefault(); e.stopPropagation(); const r = cur(), q = Math.round(num(E.q.value)); if(!r || !(q >= 1 && q <= +r.dataset.max)){ toast('Quantité invalide'); return; } await onOk(r.value, q, E.d.value || t); };
}
function setStatus(id, st, quiet, ld){
  const m = S.moves.find(x => x.id === id); if(!m || m.status === st) return;
  // Commande de plusieurs produits : « En route » / « Livré » s'appliquent à toute la commande (même livreur, même statut)
  const grp = st !== 'annule' && m.ord ? S.moves.filter(x => x.type === 'vente' && x.ord === m.ord && x.status === m.status && (x.liv || '') === (m.liv || '')) : [m];
  const ids = grp.map(x => x.id);
  const err = checkStock(S.moves.map(x => ids.includes(x.id) ? Object.assign({}, x, {status:st}) : x), grp.map(x => x.pid));
  if(err){ toast(err + ' — faites d\'abord une entrée de stock ou un envoi au livreur, puis touchez « Livré ».'); return; }
  const wasLivre = m.status === 'livre';
  grp.forEach(x => { x.status = st; if(st === 'livre') x.ldate = ld || today(); else delete x.ldate; }); save(); render(); if(!quiet) saleSheet(id);
  if(st === 'livre') cheer('Livrée ✅ — commission comptée', 60); else toast(st === 'annule' ? (wasLivre ? 'Vente annulée — stock remis' : 'Commande annulée') : 'Statut : ' + STATUS[st]);
}

/* ---------- Sauvegarde ---------- */
function download(name, text, mime){
  try{
    const url = URL.createObjectURL(new Blob([text], {type:mime}));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }catch(e){}
}
function copyText(t){
  try{ navigator.clipboard.writeText(t).then(() => toast('Copié ✅'), () => toast('Sélectionnez le texte et copiez-le')); }
  catch(e){ toast('Sélectionnez le texte et copiez-le'); }
}

function restoreSheet(){
  sheet('Restaurer une sauvegarde', `<p class="note" style="margin-bottom:12px">Attention : les données actuelles seront remplacées.</p>
    <div class="stack"><label class="btn primary block" style="cursor:pointer">Choisir le fichier de sauvegarde<input type="file" accept=".json,application/json,text/plain" id="rfile" hidden></label>
    <p class="note" style="text-align:center">ou collez le texte de la sauvegarde :</p>
    <textarea class="code" id="rtx" placeholder='{"settings":…}'></textarea>
    <button class="btn block" id="rgo">Restaurer depuis le texte</button></div>`);
  const apply = async txt => {
    let d; try{ d = JSON.parse(txt); }catch(e){ toast('Fichier invalide'); return; }
    if(!d || !Array.isArray(d.products) || !Array.isArray(d.moves)){ toast("Ce n'est pas une sauvegarde valide"); return; }
    if(!await ask(`Remplacer les données actuelles par cette sauvegarde (${d.products.length} produits, ${d.moves.length} opérations) ?`, 'Restaurer')) return;
    S = normalize(d); save(); closeSheet(); view = 'home'; render(); toast('Sauvegarde restaurée ✅');
  };
  $('#rfile').onchange = e => { const file = e.target.files[0]; if(!file) return; const r = new FileReader(); r.onload = () => apply(r.result); r.readAsText(file); };
  $('#rgo').onclick = () => apply($('#rtx').value.trim());
}
function csvSheet(){

  sortMoves(S.moves.filter(m => m.type === 'vente')).forEach(m => { const u = saleUSD(m), c = m.liv ? m.qty*num(m.commU) : 0;
    rows.push([m.date, m.ddate || m.date, m.dtime || '', pname(m.pid), m.qty, m.price, m.cur, m.qty*m.price, r2(u), r2(c), r2(u - m.qty*num(m.costU) - c), m.liv ? lname(m.liv) : 'Dépôt', m.liv ? liv(m.liv)?.city || '' : '', m.client, m.phone, m.addr, STATUS[m.status], m.note]); });
  const csv = '﻿' + rows.map(r => r.map(q).join(';')).join('\n');

function seedDemo(){
  const src = PRESET || GENERIC;
  S = defaults();
  Object.assign(S.settings, {shop: PRESET ? PRESET.shop + ' (exemple)' : 'Ma Boutique (exemple)', color: PRESET ? PRESET.color : '#0F766E', rate: PRESET ? PRESET.rate : 2300, setup:true});
  buildCatalog(src);
  // prix d'achat fictifs (≈ 40 % du prix de vente)
  S.products.forEach(p => { if(!isKit(p)) p.buy = p.cur === 'FC' ? Math.round(p.sell * .4 / 500) * 500 : r2(p.sell * .4); });
  const t = today(), d = k => addDays(t, -k), simple = S.products.filter(p => !isKit(p)), kits = S.products.filter(isKit), L = S.livreurs;
  let ts = Date.now() - 4e9; const push = o => S.moves.push(Object.assign({id:uid(), ts:ts++, note:''}, o));
  simple.forEach(p => push({type:'entree', pid:p.id, qty:60, cost:p.buy, date:d(24), note:'Achat fournisseur'}));
  L.forEach((l,i) => simple.forEach((p,j) => push({type:'envoi', pid:p.id, qty:8 + ((i+j)%3)*2, liv:l.id, date:d(22 - i)})));
  push({type:'depense', cat:'Expédition colis (vers une ville)', amount:25, cur:'$', rate:S.settings.rate, liv:L[L.length-1].id, date:d(21), note:'Colis Kinshasa → ' + L[L.length-1].city});
  push({type:'depense', cat:'Publicité Facebook', amount:30, cur:'$', rate:S.settings.rate, liv:'', date:d(15), note:'Campagne 7 jours'});
  push({type:'depense', cat:'Transport', amount:20000, cur:'FC', rate:S.settings.rate, liv:'', date:d(6), note:'Taxi moto marchandise'});
  const clients = ['Mme Nsimba','M. Kabeya','Mme Mbuyi','M. Lukusa','Mme Ilunga','M. Tshibangu','Mme Kapinga','M. Mukendi'];
  const addr = ['Gombe','Limete','Ngaliema','Bandal','Lemba','Kintambo','Matete','Masina'];
  let n = 0;
  for(let k = 19; k >= 0; k--){
    const cnt = (k*7) % 3 + 1;
    for(let j = 0; j < cnt; j++){
      const pool = (n % 6 === 5 && kits.length) ? kits : simple;
      const p = pool[(k + j*3 + n) % pool.length], l = L[n % L.length];
      let st = k > 2 ? 'livre' : k === 0 ? 'attente' : (j % 2 ? 'encours' : 'livre');
      if(k === 9 && j === 0) st = 'annule';
      const rec = {type:'vente', pid:p.id, qty:1 + (n % 4 === 0 ? 1 : 0), price:p.sell, cur:p.cur, rate:S.settings.rate, costU:unitCostUSD(p), commU:commUFor(p, l, toUSD(p.sell, p.cur)), liv:l.id, client:clients[n%8], phone:'', addr:addr[(n*3)%8], status:st, date:d(k)};
      if(!checkStock(S.moves.concat([rec]), [p.id])) push(rec);
      n++;
    }
  }

  L.forEach((l,i) => { const s = livStats(l.id), v = r2(Math.max(0, s.cash * (i===0 ? .7 : 1) - (i===1 ? 10 : 0)));

    if(s.earned > 0 && i !== 2) push({type:'paiecomm', liv:l.id, amount:r2(s.earned * .5), date:d(2), note:'Semaine passée'}); });
  push({type:'perte', pid:simple[1].id, qty:1, loc:'', motif:'Cassé / abîmé', costU:unitCostUSD(simple[1]), date:d(5)});
  save(); closeSheet(); view = 'home'; render(); toast('Exemples chargés — effacez-les dans Réglages quand vous voulez');
}

}

const STOCK_TYPES = ['entree','envoi','retour','perte','ajust','inventaire'];
let shType = 'all', shPid = '', shLoc = '*', shPer = 'tout', shDay = '', shQ = '';
const shLabel = m => ({entree:['📥','Achat / entrée au dépôt','green'], envoi:['🛵','Donné à ' + lname(m.liv),''], retour:['↩️','Rendu au dépôt par ' + lname(m.liv),''], perte:['❌', (m.motif === 'Écart inventaire' ? 'Manquant (contrôle)' : 'Perte' + (m.motif ? ' · ' + m.motif : '')) + ' · ' + (m.loc ? lname(m.loc) : 'Dépôt'),'red'], ajust:['➕','En trop (contrôle) · ' + (m.loc ? lname(m.loc) : 'Dépôt'),'green'], inventaire:['📋','Contrôle de stock · ' + (m.loc ? lname(m.loc) : 'Dépôt'),''], vente:['🛒','Vendu' + (m.liv ? ' par ' + lname(m.liv) : ' (dépôt)') + (m.client ? ' · ' + m.client : ''),'']})[m.type];
function stockHistMoves(){
  const inPerSh = d => shDay ? d === shDay : (shPer === 'tout' || inPer(d, shPer));
  return S.moves.filter(m => {
    const isSale = m.type === 'vente' && m.status === 'livre';
    if(!(STOCK_TYPES.includes(m.type) || isSale)) return false;
    if(shType === 'all' && isSale) return false;
    if(shType !== 'all' && shType !== 'tout+v' && !(shType === 'ecart' ? (m.type === 'ajust' || (m.type === 'perte' && m.motif === 'Écart inventaire') || m.type === 'inventaire') : shType === 'vente' ? isSale : m.type === shType)) return false;
    if(shPid && m.type !== 'inventaire' && !lines(m.pid, m.qty).some(([pid]) => pid === shPid)) return false;
    if(shPid && m.type === 'inventaire' && !(m.lines || []).some(l => l.pid === shPid)) return false;
    if(shLoc !== '*'){ const loc = m.type === 'envoi' || m.type === 'retour' || m.type === 'vente' ? (m.liv || '') : (m.loc || ''); if(loc !== shLoc) return false; }
    if(shQ){ const q = norm0(shQ); if(!norm0([m.pid ? pname(m.pid) : '', (m.lines || []).map(x => pname(x.pid)).join(' '), m.note, m.motif, m.client, m.sup, lname(m.liv || m.loc)].join(' ')).includes(q)) return false; }
    return inPerSh(mday(m));
  }).sort((a, b) => (mday(b) || '').localeCompare(mday(a) || '') || (b.ts || 0) - (a.ts || 0));
}
function shRow(m){
