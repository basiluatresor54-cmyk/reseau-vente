    return `<button class="it" data-a="invsheet:${m.id}"><div class="ic c-x">${ic}</div><div class="m"><div class="t">${esc(lab)}</div><div class="d">${(m.lines || []).length} produit(s) comptés · ${d.length ? '<b class="red">' + d.length + ' écart(s)</b>' : '✅ aucun écart'}${m.note ? ' · ' + esc(m.note) : ''}</div></div></button>`; }
  const sign = ['entree','ajust'].includes(m.type) ? '+' : m.type === 'envoi' || m.type === 'retour' ? '' : '−';
  const cost = m.type === 'entree' && num(m.cost) ? ' · achat ' + amt(m.cost, P ? P.cur : '$') + '/pièce' : '';
  return `<button class="it" data-a="${m.type === 'vente' ? 'sale' : 'move'}:${m.id}"><div class="ic c-x">${ic}</div><div class="m"><div class="t">${esc(pname(m.pid))}</div><div class="d">${esc(lab)}${cost}${m.note && m.type !== 'perte' && m.type !== 'ajust' ? ' · ' + esc(m.note) : ''}</div></div><div class="r"><b class="num ${col}">${sign}${m.qty}</b></div></button>`;
}

/* ---------- Prévisions : stock qui va finir, produits qui dorment ---------- */
function forecast(){
  const t = today(), a14 = addDays(t, -13), a30 = addDays(t, -29), st = stockAt(), sold14 = {}, last = {}, first = {};
  for(const m of S.moves){
    if(m.type === 'vente' && m.status === 'livre'){ const d = mday(m); for(const [pid, q] of lines(m.pid, m.qty)){ if(d >= a14) sold14[pid] = (sold14[pid] || 0) + q; if(!last[pid] || d > last[pid]) last[pid] = d; } }
    if(m.type === 'entree' && (!first[m.pid] || m.date < first[m.pid])) first[m.pid] = m.date;
  }
  const soon = [], sleep = [];
  for(const p of S.products){ if(isKit(p)) continue; const have = totalOf(st, p.id) - pendAll(p.id), sold = sold14[p.id] || 0, perDay = sold / 14;
    if(perDay > 0 && have > 0){ const days = have / perDay; if(days <= 7) soon.push({p, have, perDay, days, buy:Math.max(1, Math.ceil(perDay * 30))}); }
    if(have > 0 && (!last[p.id] || last[p.id] < a30) && first[p.id] && first[p.id] < a30) sleep.push({p, have, value:have * unitCostUSD(p), since:last[p.id] || ''});
  }
  soon.sort((a, b) => a.days - b.days); sleep.sort((a, b) => b.value - a.value);
  return {soon, sleep};
}
const fDays = d => d < 1 ? "moins d'1 jour" : '~' + Math.round(d) + ' jour' + (Math.round(d) > 1 ? 's' : '');
function forecastCard(){
  const {soon, sleep} = forecast(); if(!soon.length && !sleep.length) return '';
  return `<div class="card" style="margin-bottom:10px">
    ${soon.length ? `<b>⏳ Va bientôt finir</b> <span class="note">(au rythme des 14 derniers jours)</span><div class="list" style="margin:6px 0 ${sleep.length ? 12 : 0}px">${soon.map(x => `<div class="it"><div class="m"><div class="t">${esc(x.p.name)}</div><div class="d" style="white-space:normal">${fmt(x.have)} pièce(s) · ${fmt(r2(x.perDay))}/jour · <b class="red">${fDays(x.days)} de stock</b></div></div><button class="btn sm" data-a="planfor:${x.p.id}" data-q="${x.buy}">🛒 Prévoir l'achat</button></div>`).join('')}</div>` : ''}
    ${sleep.length ? `<b>🐢 Produits qui dorment</b> <span class="note">(aucune vente depuis 30 jours)</span><div class="list" style="margin-top:6px">${sleep.map(x => `<div class="it"><div class="m"><div class="t">${esc(x.p.name)}</div><div class="d" style="white-space:normal">${fmt(x.have)} pièce(s)<span class="cost"> · <b>${money(x.value)}</b> bloqués</span>${x.since ? ' · dernière vente ' + fmtDate(x.since) : ' · jamais vendu'}</div></div><button class="btn sm" data-a="newpack">🎁 Promo</button></div>`).join('')}</div>` : ''}
  </div>`;
}

function stockUpdateForm(){

  if(!P.length){ toast('Ajoutez d\'abord vos produits'); return; }

  const exp = (loc, pid) => qAt(st, loc, pid);
  const key = (loc, pid) => 'u_' + (loc || 'dep') + '_' + pid;
  sheet('📦 Mettre mon stock à jour', `<p class="note" style="margin-bottom:10px">Tapez ce que vous avez <b>réellement</b> à chaque endroit (les commandes pas encore livrées comprises). Ne changez que ce qui est différent. Les écarts sont corrigés et gardés dans l'historique ; vos ventes et votre argent ne changent pas.</p>
    <form id="suf">${locs.map(([loc, name], i) => {
      const rows = P.map(p => [p, exp(loc, p.id)]); const tot = rows.reduce((t, [, e]) => t + e, 0);
      return `<details class="card" style="margin-bottom:10px" ${i === 0 || tot ? 'open' : ''}><summary><b>${esc(name)}</b> <span class="note">· ${tot} pièce(s) attendue(s)</span></summary>
        <div class="tbw" style="margin-top:8px"><table class="tb"><tr><th>Produit</th><th class="rt">Attendu</th><th class="rt" style="width:90px">Réel</th></tr>
        ${rows.map(([p, e]) => `<tr${e ? '' : ' style="opacity:.6"'}><td>${esc(p.name)}</td><td class="rt num"><b>${e}</b></td><td class="rt"><input name="${key(loc, p.id)}" type="number" min="0" step="1" value="${e}" data-exp="${e}" style="width:80px;text-align:right"></td></tr>`).join('')}
        </table></div></details>`; }).join('')}
      <div id="suDiff" class="card" style="margin:6px 0 10px"></div>
      <div class="row2">${field('Date', `<input name="date" type="date" value="${today()}" max="${today()}">`)}${field('Note', `<input name="note" placeholder="Ex : Évaluation de la semaine">`)}</div>
      <p class="note" style="margin-bottom:10px">💡 Pour un <b>nouvel achat</b> de marchandise, utilisez plutôt « Entrée de stock » (avec le prix d'achat).</p>
      <button class="btn primary block">Enregistrer la mise à jour</button></form>`);
  const f = $('#suf'), E = f.elements;
  const diff = () => { const out = [];
    locs.forEach(([loc, name]) => P.forEach(p => { const e = exp(loc, p.id), v = Math.max(0, Math.round(num(E[key(loc, p.id)].value))); if(v !== e) out.push(`${esc(name.replace(/^\S+ /, ''))} · ${esc(p.name)} : <b class="${v < e ? 'red' : 'green'}">${v - e > 0 ? '+' : ''}${v - e}</b>`); }));
    $('#suDiff').innerHTML = out.length ? `<b>${out.length} écart(s) :</b><br>${out.join('<br>')}` : '✅ Aucun écart : tout correspond.'; };
  f.oninput = diff; diff();
  f.onsubmit = e => { e.preventDefault(); e.stopPropagation();
    const date = E.date.value || today(), note = E.note.value.trim() || 'Mise à jour du stock', ts = Date.now(); let nd = 0, nl = 0;
    locs.forEach(([loc]) => {
      const lns = [], add = [], id = uid();
      P.forEach(p => { const ex = exp(loc, p.id), real = Math.max(0, Math.round(num(E[key(loc, p.id)].value)));
        if(!ex && !real) return; lns.push({pid:p.id, exp:ex, real});
        if(real < ex) add.push({id:uid(), ts:ts + 1, type:'perte', pid:p.id, qty:ex - real, loc, motif:'Écart inventaire', costU:unitCostUSD(p), date, note:'Mise à jour du stock : attendu ' + ex + ', réel ' + real, inv:id});
        if(real > ex) add.push({id:uid(), ts:ts + 1, type:'ajust', pid:p.id, qty:real - ex, loc, date, note:'Mise à jour du stock : attendu ' + ex + ', réel ' + real, inv:id}); });
      if(!lns.length) return;
      S.moves.push({id, ts, type:'inventaire', loc, date, lines:lns, note}); S.moves.push(...add); nd += add.length; nl++;
    });
    save(); closeSheet(); view = 'stock'; render();
    if(nd) toast(`Stock mis à jour ✅ ${nd} écart(s) corrigé(s) sur ${nl} endroit(s)`); else cheer('Stock vérifié ✅ Tout correspond', 50);
  };
}

const impFrom = () => S.settings.impFrom || 'Chine';
const cny = () => num(S.settings.cny) || 7.1;
const CURS = () => [['$','$'],['FC',LC()],['¥','¥ (yuan)']];
const curOpts = (sel, list) => (list || CURS()).map(([v,l]) => `<option value="${v}" ${v===sel?'selected':''}>${esc(l)}</option>`).join('');
const usdOf = (a, cur) => cur === '¥' ? num(a) / cny() : cur === 'FC' ? num(a) / rate() : num(a);
const fromUSD = (u, cur) => cur === '¥' ? u * cny() : cur === 'FC' ? u * rate() : u;
const amtX = (a, cur) => cur === '¥' ? fmt(a) + ' ¥' : amt(a, cur);
const cmds = () => S.moves.filter(m => m.type === 'cmd');
const fourns = () => S.moves.filter(m => m.type === 'fourn').sort((a,b) => (a.name||'').localeCompare(b.name||''));
const fname = id => (S.moves.find(m => m.id === id && m.type === 'fourn') || {}).name || '';
const cmdNo = c => 'CMD-' + String(c.date || today()).replace(/-/g,'') + '-' + String(c.id).slice(-4).toUpperCase();
function cmdCalc(c){
  const total = num(c.qty || 1) * num(c.price), cur = c.cur || '$';
  const paidU = (c.pays || []).reduce((t,p) => t + usdOf(p.amt, p.cur), 0);
  const paid = r2(fromUSD(paidU, cur)), reste = Math.max(0, r2(total - paid));
  const costU = usdOf(c.supAmt, c.supCur) + usdOf(c.shipAmt, c.shipCur) + usdOf(c.dutyAmt, c.dutyCur) + usdOf(c.extraAmt, c.extraCur);
  const totalU = usdOf(total, cur);
  return {total, cur, paid, paidU, reste, resteU: usdOf(reste, cur), costU, totalU, margeU: totalU - costU, hasCost: costU > 0};
}
const cmdActive = c => c.step !== 'livre' && c.step !== 'annule';
let impTab = 'cours', impQ = '';

function impStats(){
  const L = cmds(), act = L.filter(cmdActive), mo = today().slice(0,7);
  const s = {n: act.length, resteU: 0, paidU: 0, margeAct: 0, margeMois: 0, livMois: 0, late: 0};
  act.forEach(c => { const k = cmdCalc(c); s.resteU += k.resteU; s.paidU += k.paidU; s.margeAct += k.margeU; if(c.eta && c.eta < today() && STEPK.indexOf(c.step) < ARRI()) s.late++; });
  L.filter(c => c.step === 'livre' && String((c.steps||{}).livre || c.date).slice(0,7) === mo).forEach(c => { s.margeMois += cmdCalc(c).margeU; s.livMois++; });
  return s;
}
function impHomeCard(){
  if(!impOn()) return '';
  const s = impStats();
  return `<button class="card daycard" data-a="nav:import" style="margin-bottom:12px"><span>📦 Commandes import : <b>${s.n}</b> en cours${s.resteU > 0 ? ` · reste à encaisser <b class="num">${money(s.resteU)}</b>` : ''}${s.late ? ` · <b style="color:var(--bad)">${s.late} en retard</b>` : ''}</span><span class="note">Voir ›</span></button>`;
}
function stepBadge(c){
  const s = stepOf(c.step), late = c.eta && c.eta < today() && cmdActive(c) && STEPK.indexOf(c.step) < ARRI();
  const col = c.step === 'livre' ? 'var(--ok)' : c.step === 'annule' ? 'var(--muted)' : c.step === 'arrive' ? 'var(--brand-tx)' : 'var(--vio)';
  return `<span style="color:${col};font-weight:700">${s[2]} ${esc(s[1])}</span>${late ? ' · <b style="color:var(--bad)">en retard</b>' : ''}`;
}
function cmdRow(c){
  const k = cmdCalc(c);
  return `<button class="it" data-a="cmd:${c.id}">${c.photo ? `<div class="ic pic"><img src="${c.photo}" alt=""></div>` : `<div class="ic c-send">${ico('box')}</div>`}
    <div class="m"><div class="t">${esc(c.title || 'Commande')}${num(c.qty) > 1 ? ' × ' + c.qty : ''}</div><div class="d">${esc(c.client || 'Client')} · ${stepBadge(c)}</div></div>
    <div class="r"><div class="big num">${amtX(k.total, k.cur)}</div><div class="sm">${k.reste > 0 ? 'reste ' + amtX(k.reste, k.cur) : (c.step === 'annule' ? 'annulée' : 'soldé ✅')}</div></div></button>`;
}
function vImport(){
  if(!impOn()) return `<div class="card empty"><b>Commandes import</b>Activez « J'importe sur commande » dans Réglages.<div style="margin-top:12px"><button class="btn primary" data-a="nav:reglages">Ouvrir les réglages</button></div></div>`;
  const s = impStats(), L = cmds(), q = impQ.trim().toLowerCase();
  const tabs = [['cours','En cours'], ...Object.entries(STEP_SHORT), ['livre','✅ Livrées'], ['annule','Annulées']];
  let list = L.filter(c => impTab === 'cours' ? cmdActive(c) : c.step === impTab);
  if(q) list = list.filter(c => [c.title, c.client, c.phone, c.lot, c.track, c.porder, c.tcode, c.plat, cmdNo(c)].join(' ').toLowerCase().includes(q));
  list.sort((a,b) => (b.ts||0) - (a.ts||0));
  const lots = {}; L.filter(cmdActive).forEach(c => { if(c.lot) (lots[c.lot] = lots[c.lot] || []).push(c); });
  return `<div class="kpis">
    <div class="kpi"><div class="l">Commandes en cours</div><div class="v num">${s.n}</div><div class="s">${s.late ? s.late + ' en retard' : 'à suivre'}</div></div>
    <div class="kpi"><div class="l">Reste à encaisser</div><div class="v num" style="color:var(--bad)">${money(s.resteU)}</div><div class="s">≈ ${fmt(Math.round(s.resteU*rate()))} ${esc(LC())}</div></div>
    <div class="kpi"><div class="l">Acomptes reçus (en cours)</div><div class="v num">${money(s.paidU)}</div><div class="s">déjà encaissés</div></div>
    <div class="kpi"><div class="l">🔒 Marge ce mois</div><div class="v num" style="color:var(--ok)">${money(s.margeMois)}</div><div class="s">${s.livMois} livrée(s) · prévue ${money(s.margeAct)}</div></div>
  </div>
  <div class="btns" style="margin:12px 0"><button class="btn primary" data-a="cmdnew">+ Nouvelle commande</button><button class="btn" data-a="fourns">🔒 Fournisseurs</button><button class="btn" data-a="transs">🔒 Transitaires</button></div>
  ${Object.keys(lots).length ? `<div class="sec"><h2>Envois groupés</h2></div><div class="list">${Object.entries(lots).map(([n, cs]) => `<div class="it" style="cursor:default"><div class="ic c-send">${ico('send')}</div><div class="m"><div class="t">${esc(n)}</div><div class="d">${cs.length} commande(s) · ${[...new Set(cs.map(c => stepOf(c.step)[2] + ' ' + stepOf(c.step)[1]))].join(', ')}</div></div><div class="r"><button class="btn sm" data-a="lotarrive:${encodeURIComponent(n)}">📦 Lot arrivé</button></div></div>`).join('')}</div>` : ''}
  <div class="chips" style="margin-top:14px">${tabs.map(([k,l]) => `<button class="chip ${impTab===k?'on':''}" data-a="imptab:${k}">${l}</button>`).join('')}</div>
  <input class="search" id="impQ" placeholder="Rechercher : client, produit, N°, lot…" value="${esc(impQ)}" style="margin:10px 0">
  <div class="list">${list.length ? list.map(cmdRow).join('') : `<div class="empty"><b>Aucune commande</b>${impTab === 'cours' ? 'Touchez « + Nouvelle commande » quand un client vous paie un acompte.' : 'Rien dans cette étape.'}</div>`}</div>`;
}

    <div class="f"><span>Photo (optionnel)</span><div style="display:flex;gap:10px;align-items:center"><div id="cmdPh" class="ic pic" style="width:54px;height:54px">${c?.photo ? `<img src="${c.photo}" alt="">` : ''}</div><label class="btn sm" style="cursor:pointer">Choisir une photo<input type="file" accept="image/*" id="cmdPhIn" hidden></label></div></div>
    ${c ? '' : `<div class="sec" style="margin:10px 0 6px"><h2>Acompte reçu aujourd'hui</h2></div>
    <div class="row3">${field('Montant', `<input name="depAmt" type="number" step="any" min="0" placeholder="0">`)}${field('Devise', `<select name="depCur">${curOpts('$', [['$','$'],['FC',LC()]])}</select>`)}${field('Payé en', `<select name="depPay">${PAYS.map(p => `<option>${p}</option>`).join('')}</select>`)}</div>`}
    <details class="card" style="margin:12px 0;border:1.5px dashed var(--line)" ${c && (c.fid || c.supAmt) ? 'open' : ''}><summary><b>🔒 Privé : fournisseur, coûts, suivi</b> <span class="note">(jamais visible par le client)</span></summary><div style="margin-top:10px">

      <div id="newF" hidden>${field('Nom du nouveau fournisseur', `<input name="fnew" maxlength="60" placeholder="Ex : Shenzhen Phones (WeChat …)">`)}</div>
      <div class="row2">${field('Plateforme', `<select name="plat"><option value="">—</option>${PLATS.map(x => `<option ${c?.plat===x?'selected':''}>${x}</option>`).join('')}</select>`)}${field('N° de commande plateforme', `<input name="porder" value="${esc(c?.porder)}">`)}</div>
      ${field('Lien du produit', `<input name="plink" type="url" value="${esc(c?.plink)}" placeholder="https://item.taobao.com/…">`)}
      ${money2('Prix payé au fournisseur (total)', 'sup', c?.supAmt, c?.supCur || '¥')}
      ${field('Transitaire', `<select name="tid"><option value="">— Choisir —</option>${transList().map(t => `<option value="${t.id}" ${c && c.tid === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}<option value="__new">+ Nouveau transitaire…</option></select>`)}
      <div id="newT" hidden>${field('Nom du nouveau transitaire', `<input name="tnew" maxlength="60" placeholder="Ex : Trans Express Zando">`)}</div>

      <div class="row2">${field('Transport', `<select name="how"><option value="">—</option>${[['avion','✈️ Avion'],['bateau','🚢 Bateau'],['route','🚚 Route']].map(([v,l]) => `<option value="${v}" ${c?.how===v?'selected':''}>${l}</option>`).join('')}</select>`)}${field('Arrivée prévue', `<input name="eta" type="date" value="${esc(c?.eta)}">`)}</div>
      ${money2('Frais de transport', 'ship', c?.shipAmt, c?.shipCur)}

      <div id="cmdMarge" class="tot" style="margin-top:6px"></div>
    </div></details>
    ${field('Note', `<input name="note" value="${esc(c?.note)}" placeholder="Couleur, capacité, détails…">`)}
    <button class="btn primary block">${c ? 'Enregistrer' : 'Créer la commande'}</button>

  sheet(c ? 'Modifier la commande' : 'Nouvelle commande import', h);

  const autoShip = () => { const T = transOf(E.tid.value); if(!T || !shipAuto) return; const r = E.how.value === 'bateau' ? 0 : num(T.rAir); if(r && num(E.kg.value)){ E.shipAmt.value = r2(r * num(E.kg.value)); E.shipCur.value = '$'; } };

  $('#cmdPhIn').onchange = async e => { const fl = e.target.files[0]; if(!fl) return; try{ photo = await smallImage(fl, 240, .72); $('#cmdPh').innerHTML = `<img src="${photo}" alt="">`; }catch(_){ toast('Image illisible'); } };

  };
  f.addEventListener('input', upd); upd();
  f.onsubmit = e => {
    e.preventDefault(); e.stopPropagation();
    let fid = E.fid.value;
    if(fid === '__new'){ const n = E.fnew.value.trim(); if(n){ const F = {id:uid(), type:'fourn', date:today(), ts:Date.now(), name:n}; S.moves.push(F); fid = F.id; } else fid = ''; }

    if(tid === '__new'){ const n = E.tnew.value.trim(); if(n){ const T = {id:uid(), type:'trans', date:today(), ts:Date.now(), name:n}; S.moves.push(T); tid = T.id; } else tid = ''; }
    const base = {client:E.client.value.trim(), phone:E.phone.value.trim(), addr:E.addr.value.trim(), title:E.title.value.trim(), qty:Math.max(1, Math.round(num(E.qty.value) || 1)), price:num(E.price.value), cur:E.cur.value, photo,
      fid, supAmt:num(E.supAmt.value), supCur:E.supCur.value, how:E.how.value, eta:E.eta.value, shipAmt:num(E.shipAmt.value), shipCur:E.shipCur.value, dutyAmt:num(E.dutyAmt.value), dutyCur:E.dutyCur.value, extraAmt:num(E.extraAmt.value), extraCur:E.extraCur.value,
      track:E.track.value.trim(), lot:E.lot.value.trim(), note:E.note.value.trim(), plat:E.plat.value, porder:E.porder.value.trim(), plink:E.plink.value.trim(), tid, tcode:E.tcode.value.trim(), kg:num(E.kg.value)};
    if(c){ Object.assign(c, base); save(); closeSheet(); render(); cmdSheet(c.id); toast('Commande modifiée'); return; }
    const rec = Object.assign({id:uid(), type:'cmd', date:today(), ts:Date.now(), step:'acompte', steps:{acompte:today()}, pays:[]}, base);
    if(num(E.depAmt.value) > 0) rec.pays.push({id:uid(), date:today(), amt:num(E.depAmt.value), cur:E.depCur.value, pay:E.depPay.value});
    S.moves.push(rec); save(); closeSheet(); view = 'import'; impTab = 'cours'; render(); cmdSheet(rec.id);
    toast('Commande ' + cmdNo(rec) + ' créée ✅');
  };
}

function cmdMsg(c, step){
  const st = S.settings, k = cmdCalc(c), hi = `Bonjour ${c.client || ''} 👋`, ref = `Commande N° ${cmdNo(c)} — ${c.title}${num(c.qty) > 1 ? ' × ' + c.qty : ''}`;
  const money3 = `Total : ${amtX(k.total, k.cur)} · Déjà payé : ${amtX(k.paid, k.cur)}${k.reste > 0 ? ' · *Reste à payer : ' + amtX(k.reste, k.cur) + '*' : ' · ✅ Tout est payé'}`;
  const eta = c.eta ? '\n📅 Arrivée prévue : ' + dAbs(c.eta, 1) : '';
  const how = c.how === 'bateau' ? '🚢' : c.how === 'route' ? '🚚' : '✈️';
  const T = {
    acompte: `${hi}\n\nNous avons bien reçu votre paiement ✅\n${ref}\n${money3}${eta}\n\nNous vous informerons à chaque étape.`,
    commande: `${hi}\n\n🛒 Votre commande a été passée auprès de notre fournisseur.\n${ref}${eta}\n\nNous vous prévenons dès l'expédition.`,
    entrepot: `${hi}\n\n🏭 Votre commande est bien arrivée à notre entrepôt en Chine. Elle partira avec le prochain envoi.\n${ref}${eta}`,
    expedie: `${hi}\n\n${how} Bonne nouvelle : votre commande est en route !\n${ref}${eta}${c.track ? '\n🔎 N° de suivi : ' + c.track : ''}`,
    arrive: `${hi}\n\n📦 Votre commande est arrivée et elle est prête !\n${ref}\n${money3}\n\nRépondez-nous pour la livraison ou le retrait.`,
    livre: `${hi}\n\n✅ Merci pour votre confiance ! Votre commande vous a été remise.\n${ref}\n${money3}`,
    annule: `${hi}\n\nVotre commande ${cmdNo(c)} (${c.title}) a été annulée. Contactez-nous pour toute question.`
  };
  return T[step || c.step] + `\n\n${st.shop}${st.wa ? ' · ' + st.wa : ''}`;
}

/* ---------- Synchronisation des données (produits, livreurs, opérations) ---------- */
// JSON canonique (clés triées) : la base réordonne les clés, il faut comparer le contenu, pas l'ordre.
function cj(v){
  if(Array.isArray(v)) return '[' + v.map(cj).join(',') + ']';
  if(v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + cj(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function fnv(str){ let h = 0x811c9dc5; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const KINDS = [['product','products'],['livreur','livreurs'],['move','moves']];
const ARR = {product:'products', livreur:'livreurs', move:'moves'};
let META = {last:null, h:{}};
const SYNC = {busy:false, again:false, state:'idle', pending:0, err:'', t:null};
function loadMeta(){ try{ const m = JSON.parse(localStorage.getItem(KEY + '_sync') || 'null'); if(m && m.h) return m; }catch(_){} return {last:null, h:{}}; }
function saveMeta(){ try{ localStorage.setItem(KEY + '_sync', JSON.stringify(META)); }catch(_){} }
function shopWritable(){ const si = subInfo(ONLINE.shop); return !!ONLINE.shop && (!si || si.cls !== 'bad') && ['proprietaire','gerant','vendeur'].includes(ONLINE.role); }
function computeDirty(){
  const out = [], seen = new Set();
  for(const [kind, arr] of KINDS) for(const it of S[arr] || []){
    if(!it || it.id == null) continue;
    const key = kind + ':' + it.id; seen.add(key);
    const h = fnv(cj(it));

/* Actions du livreur sans réseau : gardées dans le téléphone, envoyées au retour de la connexion */
const LQ_KEY = () => 'stock_livq_' + (ONLINE.shop ? ONLINE.shop.id : '');
const lqGet = () => { try{ return JSON.parse(localStorage.getItem(LQ_KEY()) || '[]'); }catch(_){ return []; } };
const lqSet = q => { try{ localStorage.setItem(LQ_KEY(), JSON.stringify(q)); }catch(_){} };
const isNetErr = e => navigator.onLine === false || /fetch|network|load failed|timeout|offline/i.test(String(e && (e.message || e.error_description || e)));
let LQ_BUSY = false;
async function livRpc(fn, params, note){
  const queue = () => { const q = lqGet(); q.push({fn, params, note, at:Date.now()}); lqSet(q); toast('📶 Pas de réseau : c\'est enregistré dans le téléphone, envoi automatique dès que la connexion revient'); return {ok:true, queued:true}; };
  if(navigator.onLine === false) return queue();
  try{ const {data, error} = await sb.rpc(fn, params);
    if(error) return isNetErr(error) ? queue() : {ok:false, error};
    return data ? {ok:true} : {ok:false};
  }catch(e){ return isNetErr(e) ? queue() : {ok:false, error:e}; }
}
async function lqFlush(){
  if(LQ_BUSY || navigator.onLine === false || !ONLINE.shop) return; const q = lqGet(); if(!q.length) return;
  LQ_BUSY = true; let sent = 0, failed = 0; const rest = [];
  try{
    for(let i = 0; i < q.length; i++){ const it = q[i];
      try{ const {data, error} = await sb.rpc(it.fn, it.params);
        if(error && isNetErr(error)){ rest.push(...q.slice(i)); break; }
        if(error || !data){ failed++; continue; }
        sent++; if(it.note) notifyShop('owners', it.note.t, it.note.b, {tag:it.note.tag});
      }catch(e){ if(isNetErr(e)){ rest.push(...q.slice(i)); break; } failed++; }
    }
  } finally { lqSet(rest); LQ_BUSY = false; }
  if(sent) toast(`✅ ${sent} action(s) envoyée(s) au vendeur`);
  if(failed) toast(`⚠️ ${failed} action(s) refusée(s) (commande déjà modifiée par le vendeur ?)`);
  if(view === 'moi') render();
}
window.addEventListener('online', () => { lqFlush().then(() => syncNow()); });

// Réduit la photo (≈ 1280 px, JPEG) avant l'envoi : rapide même avec une petite connexion
function shrinkImage(file){
  return new Promise((ok, ko) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : ko(new Error('image')), 'image/jpeg', 0.72);
    };
    img.onerror = () => ko(new Error('image')); img.src = url;
  });
}

  return PUSH_ON ? 'on' : 'off';

const u8 = b => { const s = (b + '='.repeat((4 - b.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/'); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const ab64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function pushEnable(){
  try{
    const perm = await Notification.requestPermission(); if(perm !== 'granted'){ toast('Notifications refusées. Autorisez-les dans les réglages du téléphone.'); render(); return; }
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:u8(VAPID_PUBLIC)});
    const j = sub.toJSON();
    await sb.from('push_subs').delete().eq('endpoint', j.endpoint);
    const {error} = await sb.from('push_subs').insert({shop_id:ONLINE.shop.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth});
    if(error){ toast('Erreur : ' + rpcErr(error)); return; }
    PUSH_ON = true; render(); toast('Notifications activées 🔔');
    sb.functions.invoke('push', {body:{mode:'selftest'}}).catch(() => {});
  }catch(e){ toast('Impossible d\'activer : ' + (e && e.message || e)); }
}
async function pushDisable(){
  try{ const reg = await navigator.serviceWorker.getRegistration(), sub = reg && await reg.pushManager.getSubscription();
    if(sub){ await sb.from('push_subs').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); } }catch(_){}
  PUSH_ON = false; render(); toast('Notifications désactivées');
}
A.pushon = () => pushEnable();
A.notiflater = () => { try{ localStorage.setItem('stock_notif_later', today()); }catch(_){} render(); };
A.pushoff = () => pushDisable();
A.pushtest = () => { sb.functions.invoke('push', {body:{mode:'selftest'}}).then(() => toast('Notification de test envoyée')).catch(() => toast('Hors ligne')); };
function notifCard(){
  const st = pushState(), liv = ONLINE.role === 'livreur';
  const what = liv ? 'vos nouvelles livraisons, un rappel 1 h avant chaque livraison et la confirmation de vos versements' : 'les versements déclarés, les livraisons faites, un rappel 1 h avant chaque livraison, le résumé du matin et le point du soir (19 h)';
  const body = st === 'on' ? `<p class="note" style="margin-bottom:10px">✅ Activées sur cet appareil : ${what}.</p><div class="btns"><button class="btn" data-a="pushtest">Envoyer un test</button><button class="btn ghost-bad" data-a="pushoff">Désactiver</button></div>`
    : st === 'install' ? `<p class="note">Sur iPhone, les notifications marchent seulement quand l'application est <b>installée sur l'écran d'accueil</b> : Safari → Partager → « Sur l'écran d'accueil », puis ouvrez-la depuis l'icône et revenez ici.</p><button class="btn block" style="margin-top:8px" data-a="install">📲 Voir comment installer</button>`
    : st === 'denied' ? `<p class="note">Les notifications sont bloquées. Autorisez-les dans les réglages du téléphone (Réglages → Notifications → Réseau Vente), puis revenez ici.</p>`
    : st === 'unsupported' ? `<p class="note">Ce navigateur ne permet pas les notifications. Utilisez Chrome (Android) ou l'application installée sur iPhone.</p>`
    : `<p class="note" style="margin-bottom:10px">Recevez sur ce téléphone : ${what}.</p><button class="btn primary block" data-a="pushon">🔔 Activer les notifications</button>`;
  return `<div class="sec"><h2>🔔 Notifications</h2></div><div class="card" style="margin-bottom:12px">${body}</div>`;
}
// Événements envoyés aux autres membres de la boutique
function notifyShop(to, title, bodyTxt, extra){
  if(!ONLINE.shop || ONLINE.offline) return;
  try{ sb.functions.invoke('push', {body:Object.assign({shop_id:ONLINE.shop.id, to, title, body:bodyTxt}, extra || {})}).catch(() => {}); }catch(_){}
}
window.onSaleCreated = rec => { if(rec.liv && ONLINE.role !== 'livreur') notifyShop('livreur', '🛵 Nouvelle livraison', `${pname(rec.pid)} × ${rec.qty}${rec.client ? ' — ' + rec.client : ''}\n📅 ${whenTxt(rec)}${rec.addr ? '\n📍 ' + rec.addr : ''}`, {livreur_id:rec.liv, tag:'new-' + rec.id}); };
